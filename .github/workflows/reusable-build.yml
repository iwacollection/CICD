name: Reusable Build

on:
  workflow_call:
    inputs:
      project_name:
        description: "Logical project name"
        required: true
        type: string
      working_directory:
        description: "Project directory inside the caller repository"
        required: false
        default: "."
        type: string
      build_command:
        description: "Trusted non-interactive build command"
        required: true
        type: string
      test_command:
        description: "Optional trusted test command"
        required: false
        default: ""
        type: string
      artifact_paths_json:
        description: "JSON array of artifact globs relative to working_directory"
        required: true
        type: string
      soc:
        description: "generic/rk/qualcomm/mediatek"
        required: false
        default: "generic"
        type: string
      target_os:
        description: "linux/android"
        required: false
        default: "linux"
        type: string
      arch:
        description: "x86_64/arm64/armhf"
        required: false
        default: "x86_64"
        type: string
      toolchain:
        description: "Immutable logical toolchain version"
        required: true
        type: string
      container_image:
        description: "Optional build image; when set it must use registry/repo@sha256:digest"
        required: false
        default: ""
        type: string
      container_registry:
        description: "Optional private registry hostname for docker login"
        required: false
        default: ""
        type: string
      runner_labels_json:
        description: "JSON runner label array, e.g. [\"ubuntu-latest\"]"
        required: false
        default: '["ubuntu-latest"]'
        type: string
      cache_paths:
        description: "Optional multiline cache paths relative to workspace"
        required: false
        default: ""
        type: string
      cache_key_extra:
        description: "Extra cache invalidation token"
        required: false
        default: "v1"
        type: string
      cache_key_files_json:
        description: "JSON cache inputs relative to working_directory; required with cache_paths"
        required: false
        default: "[]"
        type: string
      platform_ref:
        description: "Exact 40-character CICD platform commit SHA"
        required: true
        type: string
    secrets:
      container_registry_username:
        required: false
      container_registry_password:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: ${{ inputs.project_name }} / ${{ inputs.soc }} / ${{ inputs.target_os }} / ${{ inputs.arch }}
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 120
    steps:
      - name: Checkout caller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          persist-credentials: false

      - name: Require immutable CI platform revision
        shell: bash
        env:
          CI_PLATFORM_REF: ${{ inputs.platform_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$CI_PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "platform_ref must be an exact 40-character commit SHA" >&2
            exit 1
          fi

      - name: Checkout CI platform scripts only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: iwacollection/CICD
          ref: ${{ inputs.platform_ref }}
          path: .ci-platform
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
          sparse-checkout-cone-mode: true

      - name: Require immutable toolchain image
        if: inputs.container_image != ''
        shell: bash
        env:
          CI_CONTAINER_IMAGE: ${{ inputs.container_image }}
        run: |
          set -euo pipefail
          if [[ ! "$CI_CONTAINER_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "container_image must be pinned by an immutable sha256 digest" >&2
            exit 1
          fi

      - name: Login private toolchain registry
        if: inputs.container_image != '' && inputs.container_registry != ''
        shell: bash
        env:
          CI_REGISTRY: ${{ inputs.container_registry }}
          CI_REGISTRY_USERNAME: ${{ secrets.container_registry_username }}
          CI_REGISTRY_PASSWORD: ${{ secrets.container_registry_password }}
        run: |
          set -euo pipefail
          if [[ -z "${CI_REGISTRY_USERNAME:-}" || -z "${CI_REGISTRY_PASSWORD:-}" ]]; then
            echo "Registry credentials are required for private container registry $CI_REGISTRY" >&2
            exit 1
          fi
          printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USERNAME" --password-stdin

      - name: Pull toolchain container
        id: container
        if: inputs.container_image != ''
        shell: bash
        env:
          CI_CONTAINER_IMAGE: ${{ inputs.container_image }}
        run: |
          set -euo pipefail
          docker pull "$CI_CONTAINER_IMAGE"
          identity="$(docker image inspect "$CI_CONTAINER_IMAGE" --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}{{.Id}}{{end}}')"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "Using toolchain container: $identity"

      - name: Compute declared cache fingerprint
        if: inputs.cache_paths != ''
        id: cache
        shell: bash
        env:
          CI_CACHE_KEY_FILES: ${{ inputs.cache_key_files_json }}
        run: >-
          python3 .ci-platform/scripts/ci/cache_fingerprint.py
          --working-directory "source/${{ inputs.working_directory }}"
          --patterns-json "$CI_CACHE_KEY_FILES"

      - name: Restore build cache
        if: inputs.cache_paths != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ inputs.cache_paths }}
          key: reusable-ci-v3-${{ inputs.project_name }}-${{ inputs.soc }}-${{ inputs.target_os }}-${{ inputs.arch }}-${{ inputs.toolchain }}-${{ inputs.cache_key_extra }}-${{ steps.cache.outputs.fingerprint }}
          restore-keys: |
            reusable-ci-v3-${{ inputs.project_name }}-${{ inputs.soc }}-${{ inputs.target_os }}-${{ inputs.arch }}-${{ inputs.toolchain }}-${{ inputs.cache_key_extra }}-

      - name: Build
        shell: bash
        env:
          CI_BUILD_COMMAND: ${{ inputs.build_command }}
          CI_CONTAINER_IMAGE: ${{ inputs.container_image }}
        run: |
          set -euo pipefail
          args=(--working-directory "source/${{ inputs.working_directory }}" --command "$CI_BUILD_COMMAND")
          if [[ -n "${CI_CONTAINER_IMAGE:-}" ]]; then
            args+=(--container-image "$CI_CONTAINER_IMAGE")
          fi
          python3 .ci-platform/scripts/ci/run_build.py "${args[@]}"

      - name: Test
        if: inputs.test_command != ''
        shell: bash
        env:
          CI_TEST_COMMAND: ${{ inputs.test_command }}
          CI_CONTAINER_IMAGE: ${{ inputs.container_image }}
        run: |
          set -euo pipefail
          args=(--working-directory "source/${{ inputs.working_directory }}" --command "$CI_TEST_COMMAND")
          if [[ -n "${CI_CONTAINER_IMAGE:-}" ]]; then
            args+=(--container-image "$CI_CONTAINER_IMAGE")
          fi
          python3 .ci-platform/scripts/ci/run_build.py "${args[@]}"

      - name: Package immutable artifact
        id: package
        env:
          CI_ARTIFACT_PATHS: ${{ inputs.artifact_paths_json }}
        run: >-
          python3 .ci-platform/scripts/ci/package_artifact.py
          --project "${{ inputs.project_name }}"
          --working-directory "source/${{ inputs.working_directory }}"
          --artifacts-json "$CI_ARTIFACT_PATHS"
          --soc "${{ inputs.soc }}"
          --target-os "${{ inputs.target_os }}"
          --arch "${{ inputs.arch }}"
          --toolchain "${{ inputs.toolchain }}"

      - name: Verify artifact
        run: >-
          python3 .ci-platform/scripts/ci/verify_artifact.py
          --directory dist
          --expected-sha256 "${{ steps.package.outputs.digest }}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.bundle }}
            ${{ steps.package.outputs.manifest }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Summary
        run: |
          {
            echo "### Reusable CI build complete"
            echo "- Project: ${{ inputs.project_name }}"
            echo "- Target: ${{ inputs.soc }} / ${{ inputs.target_os }} / ${{ inputs.arch }}"
            echo "- Toolchain: ${{ inputs.toolchain }}"
            echo "- Execution: ${{ inputs.container_image != '' && 'container' || 'host' }}"
            echo "- Container identity: ${{ steps.container.outputs.identity || 'host execution' }}"
            echo "- SHA256: ${{ steps.package.outputs.digest }}"
            echo "- Rebuild-on-promotion: NO"
          } >> "$GITHUB_STEP_SUMMARY"
