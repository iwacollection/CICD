name: Reusable Build

on:
  workflow_call:
    inputs:
      project_name:
        description: "Logical project name"
        required: true
        type: string
      working_directory:
        description: "Project directory inside the caller repository"
        required: false
        default: "."
        type: string
      build_command:
        description: "Trusted non-interactive build command"
        required: true
        type: string
      test_command:
        description: "Optional trusted test command"
        required: false
        default: ""
        type: string
      pr_validation_command:
        description: "Optional hosted-safe validation command for self-hosted targets on pull requests"
        required: false
        default: ""
        type: string
      artifact_paths_json:
        description: "JSON array of artifact globs relative to working_directory"
        required: true
        type: string
      soc:
        description: "generic/rk/qualcomm/mediatek"
        required: false
        default: "generic"
        type: string
      target_os:
        description: "linux/android"
        required: false
        default: "linux"
        type: string
      arch:
        description: "x86_64/arm64/armhf"
        required: false
        default: "x86_64"
        type: string
      toolchain:
        description: "Immutable logical toolchain version"
        required: true
        type: string
      container_image:
        description: "Optional build image; when set it must use registry/repo@sha256:digest"
        required: false
        default: ""
        type: string
      container_registry:
        description: "Optional private registry hostname for docker login"
        required: false
        default: ""
        type: string
      runner_labels_json:
        description: "JSON runner label array, e.g. [\"ubuntu-latest\"]"
        required: false
        default: '["ubuntu-latest"]'
        type: string
      cache_paths:
        description: "Optional multiline cache paths relative to workspace"
        required: false
        default: ""
        type: string
      cache_key_extra:
        description: "Extra cache invalidation token"
        required: false
        default: "v1"
        type: string
      cache_key_files_json:
        description: "JSON cache inputs relative to working_directory; required with cache_paths"
        required: false
        default: "[]"
        type: string
      platform_ref:
        description: "Exact 40-character CICD platform commit SHA"
        required: true
        type: string
    secrets:
      container_registry_username:
        required: false
      container_registry_password:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.project_name }} / ${{ inputs.soc }} / ${{ inputs.target_os }} / ${{ inputs.arch }}
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 120
    steps:
      - name: Checkout caller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          persist-credentials: false

      - name: Require immutable CI platform revision
        shell: bash
        env:
          CI_PLATFORM_REF: ${{ inputs.platform_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$CI_PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "platform_ref must be an exact 40-character commit SHA" >&2
            exit 1
          fi

      - name: Checkout CI platform scripts only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: iwacollection/CICD
          ref: ${{ inputs.platform_ref }}
          path: .ci-platform
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
          sparse-checkout-cone-mode: true

      - name: Require immutable toolchain image
        if: inputs.container_image != ''
        shell: bash
        env:
          CI_CONTAINER_IMAGE: ${{ inputs.container_image }}
        run: |
          set -euo pipefail
          if [[ ! "$CI_CONTAINER_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "container_image must be pinned by an immutable sha256 digest" >&2
            exit 1
          fi

      - name: Select safe execution lane
        id: lane
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUNNER_LABELS_JSON: ${{ inputs.runner_labels_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          labels = json.loads(os.environ["RUNNER_LABELS_JSON"])
          if not isinstance(labels, list) or not labels or not all(
              isinstance(label, str) and label for label in labels
          ):
              raise SystemExit("runner_labels_json must be a non-empty JSON string array")
          hardware_pr = (
              os.environ["EVENT_NAME"] == "pull_request" and "self-hosted" in labels
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"hardware_pr={str(hardware_pr).lower()}\n")
          PY

      - name: Hosted PR validation lane
        if: steps.lane.outputs.hardware_pr == 'true'
        shell: bash
        env:
          CI_PR_VALIDATION_COMMAND: ${{ inputs.pr_validation_command }}
          CI_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          if [[ -z "$CI_PR_VALIDATION_COMMAND" ]]; then
            echo "Self-hosted hardware build skipped for untrusted pull-request code."
            echo "Configure pr_validation_command to run a hosted-safe source validation."
            exit 0
          fi
          python3 .ci-platform/scripts/ci/run_build.py \
            --working-directory "source/$CI_WORKING_DIRECTORY" \
            --command "$CI_PR_VALIDATION_COMMAND"

      - name: Login private toolchain registry
        if: steps.lane.outputs.hardware_pr != 'true' && inputs.container_image != '' && inputs.container_registry != ''
        shell: bash
        env:
          CI_REGISTRY: ${{ inputs.container_registry }}
          CI_REGISTRY_USERNAME: ${{ secrets.container_registry_username }}
          CI_REGISTRY_PASSWORD: ${{ secrets.container_registry_password }}
        run: |
          set -euo pipefail
          if [[ -z "${CI_REGISTRY_USERNAME:-}" || -z "${CI_REGISTRY_PASSWORD:-}" ]]; then
            echo "Registry credentials are required for private container registry $CI_REGISTRY" >&2
            exit 1
          fi
          printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USERNAME" --password-stdin

      - name: Pull toolchain container
        id: container
        if: steps.lane.outputs.hardware_pr != 'true' && inputs.container_image != ''
        shell: bash
        env:
          CI_CONTAINER_IMAGE: ${{ inputs.container_image }}
        run: |
          set -euo pipefail
          docker pull "$CI_CONTAINER_IMAGE"
          identity="$(docker image inspect "$CI_CONTAINER_IMAGE" --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}{{.Id}}{{end}}')"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "Using toolchain container: $identity"

      - name: Compute declared cache fingerprint
        if: steps.lane.outputs.hardware_pr != 'true' && inputs.cache_paths != ''
        id: cache
        shell: bash
        env:
          CI_CACHE_KEY_FILES: ${{ inputs.cache_key_files_json }}
          CI_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: >-
          python3 .ci-platform/scripts/ci/cache_fingerprint.py
          --working-directory "source/$CI_WORKING_DIRECTORY"
          --patterns-json "$CI_CACHE_KEY_FILES"

      - name: Restore build cache
        if: steps.lane.outputs.hardware_pr != 'true' && inputs.cache_paths != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ inputs.cache_paths }}
          key: reusable-ci-v3-${{ inputs.project_name }}-${{ inputs.soc }}-${{ inputs.target_os }}-${{ inputs.arch }}-${{ inputs.toolchain }}-${{ inputs.cache_key_extra }}-${{ steps.cache.outputs.fingerprint }}
          restore-keys: |
            reusable-ci-v3-${{ inputs.project_name }}-${{ inputs.soc }}-${{ inputs.target_os }}-${{ inputs.arch }}-${{ inputs.toolchain }}-${{ inputs.cache_key_extra }}-

      - name: Build
        if: steps.lane.outputs.hardware_pr != 'true'
        shell: bash
        env:
          CI_BUILD_COMMAND: ${{ inputs.build_command }}
          CI_CONTAINER_IMAGE: ${{ inputs.container_image }}
          CI_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          args=(--working-directory "source/$CI_WORKING_DIRECTORY" --command "$CI_BUILD_COMMAND")
          if [[ -n "${CI_CONTAINER_IMAGE:-}" ]]; then
            args+=(--container-image "$CI_CONTAINER_IMAGE")
          fi
          python3 .ci-platform/scripts/ci/run_build.py "${args[@]}"

      - name: Test
        if: steps.lane.outputs.hardware_pr != 'true' && inputs.test_command != ''
        shell: bash
        env:
          CI_TEST_COMMAND: ${{ inputs.test_command }}
          CI_CONTAINER_IMAGE: ${{ inputs.container_image }}
          CI_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          args=(--working-directory "source/$CI_WORKING_DIRECTORY" --command "$CI_TEST_COMMAND")
          if [[ -n "${CI_CONTAINER_IMAGE:-}" ]]; then
            args+=(--container-image "$CI_CONTAINER_IMAGE")
          fi
          python3 .ci-platform/scripts/ci/run_build.py "${args[@]}"

      - name: Package immutable artifact
        id: package
        if: steps.lane.outputs.hardware_pr != 'true'
        env:
          CI_ARTIFACT_PATHS: ${{ inputs.artifact_paths_json }}
          CI_PROJECT_NAME: ${{ inputs.project_name }}
          CI_WORKING_DIRECTORY: ${{ inputs.working_directory }}
          CI_SOC: ${{ inputs.soc }}
          CI_TARGET_OS: ${{ inputs.target_os }}
          CI_ARCH: ${{ inputs.arch }}
          CI_TOOLCHAIN: ${{ inputs.toolchain }}
        run: >-
          python3 .ci-platform/scripts/ci/package_artifact.py
          --project "$CI_PROJECT_NAME"
          --working-directory "source/$CI_WORKING_DIRECTORY"
          --artifacts-json "$CI_ARTIFACT_PATHS"
          --soc "$CI_SOC"
          --target-os "$CI_TARGET_OS"
          --arch "$CI_ARCH"
          --toolchain "$CI_TOOLCHAIN"

      - name: Verify artifact
        if: steps.lane.outputs.hardware_pr != 'true'
        run: >-
          python3 .ci-platform/scripts/ci/verify_artifact.py
          --directory dist
          --expected-sha256 "${{ steps.package.outputs.digest }}"

      - name: Upload artifact
        if: steps.lane.outputs.hardware_pr != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.bundle }}
            ${{ steps.package.outputs.manifest }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Summary
        env:
          HARDWARE_PR: ${{ steps.lane.outputs.hardware_pr }}
          PR_VALIDATION_COMMAND: ${{ inputs.pr_validation_command }}
          PROJECT_NAME: ${{ inputs.project_name }}
          SOC: ${{ inputs.soc }}
          TARGET_OS: ${{ inputs.target_os }}
          ARCH: ${{ inputs.arch }}
          TOOLCHAIN: ${{ inputs.toolchain }}
          EXECUTION_MODE: ${{ inputs.container_image != '' && 'container' || 'host' }}
          CONTAINER_IDENTITY: ${{ steps.container.outputs.identity || 'host execution' }}
          ARTIFACT_SHA256: ${{ steps.package.outputs.digest }}
        run: |
          {
            echo "### Reusable CI build complete"
            echo "- Project: $PROJECT_NAME"
            echo "- Target: $SOC / $TARGET_OS / $ARCH"
            echo "- Toolchain: $TOOLCHAIN"
            if [[ "$HARDWARE_PR" == "true" ]]; then
              echo "- Execution: hosted pull-request validation lane"
              if [[ -n "$PR_VALIDATION_COMMAND" ]]; then
                echo "- Validation: hosted-safe command completed"
              else
                echo "- Validation: metadata only; hardware build deferred until trusted main"
              fi
              echo "- Artifact: skipped for pull-request hardware lane"
            else
              echo "- Execution: $EXECUTION_MODE"
              echo "- Container identity: $CONTAINER_IDENTITY"
              echo "- SHA256: $ARTIFACT_SHA256"
              echo "- Rebuild-on-promotion: NO"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
