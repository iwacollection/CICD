name: Reusable Build

on:
  workflow_call:
    inputs:
      project_name:
        description: "Logical project name"
        required: true
        type: string
      working_directory:
        description: "Project directory inside the caller repository"
        required: false
        default: "."
        type: string
      build_command:
        description: "Trusted non-interactive build command"
        required: true
        type: string
      test_command:
        description: "Optional trusted test command"
        required: false
        default: ""
        type: string
      pr_validation_command:
        description: "Hosted-safe validation command required when a self-hosted target is invoked by a pull request"
        required: false
        default: ""
        type: string
      artifact_paths_json:
        description: "JSON array of artifact globs relative to working_directory"
        required: true
        type: string
      dependency_lock_files_json:
        description: "JSON array of dependency/toolchain lock file globs recorded in Artifact Contract v2"
        required: false
        default: "[]"
        type: string
      soc:
        description: "generic/rk/qualcomm/mediatek"
        required: false
        default: "generic"
        type: string
      target_os:
        description: "linux/android"
        required: false
        default: "linux"
        type: string
      arch:
        description: "x86_64/arm64/armhf"
        required: false
        default: "x86_64"
        type: string
      toolchain:
        description: "Immutable logical toolchain version"
        required: true
        type: string
      container_image:
        description: "Optional build image; when set it must use registry/repo@sha256:digest"
        required: false
        default: ""
        type: string
      container_registry:
        description: "Optional private registry hostname for docker login"
        required: false
        default: ""
        type: string
      runner_labels_json:
        description: "JSON runner label array, e.g. [\"ubuntu-latest\"]"
        required: false
        default: '["ubuntu-latest"]'
        type: string
      cache_paths:
        description: "Optional multiline cache paths relative to workspace"
        required: false
        default: ""
        type: string
      cache_key_extra:
        description: "Extra cache invalidation token"
        required: false
        default: "v1"
        type: string
      cache_key_files_json:
        description: "JSON cache inputs relative to working_directory; required with cache_paths"
        required: false
        default: "[]"
        type: string
      platform_ref:
        description: "Exact 40-character CICD platform commit SHA"
        required: true
        type: string
    secrets:
      container_registry_username:
        required: false
      container_registry_password:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.project_name }} / ${{ inputs.soc }} / ${{ inputs.target_os }} / ${{ inputs.arch }}
    runs-on: ${{ contains(fromJSON(inputs.runner_labels_json), 'self-hosted') && github.ref != 'refs/heads/main' && 'ubuntu-latest' || fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 120
    steps:
      - name: Checkout caller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          persist-credentials: false

      - name: Require immutable CI platform revision
        shell: bash
        env:
          CI_PLATFORM_REF: ${{ inputs.platform_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$CI_PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "platform_ref must be an exact 40-character commit SHA" >&2
            exit 1
          fi

      - name: Checkout immutable CI platform policy and scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: iwacollection/CICD
          ref: ${{ inputs.platform_ref }}
          path: .ci-platform
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            ci
          sparse-checkout-cone-mode: true

      - name: Validate central supply-chain policy
        run: python3 .ci-platform/scripts/ci/supply_chain_policy.py --policy .ci-platform/ci/supply-chain-policy.json --skip-dockerfiles

      - name: Require immutable toolchain image
        if: inputs.container_image != ''
        shell: bash
        env:
          CI_CONTAINER_IMAGE: ${{ inputs.container_image }}
        run: |
          set -euo pipefail
          if [[ ! "$CI_CONTAINER_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "container_image must be pinned by an immutable sha256 digest" >&2
            exit 1
          fi

      - name: Select safe execution lane
        id: lane
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          RUNNER_LABELS_JSON: ${{ inputs.runner_labels_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          labels = json.loads(os.environ["RUNNER_LABELS_JSON"])
          if not isinstance(labels, list) or not labels or not all(
              isinstance(label, str) and label for label in labels
          ):
              raise SystemExit("runner_labels_json must be a non-empty JSON string array")
          self_hosted = "self-hosted" in labels
          event_name = os.environ["EVENT_NAME"]
          ref = os.environ["GITHUB_REF_VALUE"]
          hardware_pr = event_name == "pull_request" and self_hosted
          untrusted_hardware = self_hosted and ref != "refs/heads/main" and not hardware_pr
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"hardware_pr={str(hardware_pr).lower()}\n")
              output.write(f"untrusted_hardware={str(untrusted_hardware).lower()}\n")
          PY

      - name: Hosted PR validation lane
        if: steps.lane.outputs.hardware_pr == 'true'
        shell: bash
        env:
          CI_PR_VALIDATION_COMMAND: ${{ inputs.pr_validation_command }}
          CI_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          if [[ -z "$CI_PR_VALIDATION_COMMAND" ]]; then
            echo "Self-hosted hardware PR validation requires pr_validation_command." >&2
            echo "The job is intentionally failing instead of reporting metadata-only success." >&2
            exit 1
          fi
          python3 .ci-platform/scripts/ci/run_build.py \
            --working-directory "source/$CI_WORKING_DIRECTORY" \
            --command "$CI_PR_VALIDATION_COMMAND"

      - name: Reject untrusted self-hosted event
        if: steps.lane.outputs.untrusted_hardware == 'true'
        shell: bash
        run: |
          echo "Self-hosted targets may only execute privileged builds from refs/heads/main." >&2
          echo "Non-main manual dispatches, branch pushes, tags, and other refs are blocked." >&2
          exit 1

      - name: Login private toolchain registry
        if: steps.lane.outputs.hardware_pr != 'true' && inputs.container_image != '' && inputs.container_registry != ''
        shell: bash
        env:
          CI_REGISTRY: ${{ inputs.container_registry }}
          CI_REGISTRY_USERNAME: ${{ secrets.container_registry_username }}
          CI_REGISTRY_PASSWORD: ${{ secrets.container_registry_password }}
        run: |
          set -euo pipefail
          if [[ -z "${CI_REGISTRY_USERNAME:-}" || -z "${CI_REGISTRY_PASSWORD:-}" ]]; then
            echo "Registry credentials are required for private container registry $CI_REGISTRY" >&2
            exit 1
          fi
          printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USERNAME" --password-stdin

      - name: Pull toolchain container
        id: container
        if: steps.lane.outputs.hardware_pr != 'true' && inputs.container_image != ''
        shell: bash
        env:
          CI_CONTAINER_IMAGE: ${{ inputs.container_image }}
        run: |
          set -euo pipefail
          docker pull "$CI_CONTAINER_IMAGE"
          expected="${CI_CONTAINER_IMAGE##*@}"
          repo_digests="$(docker image inspect "$CI_CONTAINER_IMAGE" --format '{{json .RepoDigests}}')"
          if [[ "$repo_digests" != *"@$expected"* ]]; then
            echo "Pulled image does not resolve to expected digest $expected" >&2
            exit 1
          fi
          echo "identity=$expected" >> "$GITHUB_OUTPUT"
          echo "Using toolchain container: $CI_CONTAINER_IMAGE"

      - name: Compute declared cache fingerprint
        if: steps.lane.outputs.hardware_pr != 'true' && inputs.cache_paths != ''
        id: cache
        shell: bash
        env:
          CI_CACHE_KEY_FILES: ${{ inputs.cache_key_files_json }}
          CI_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: >-
          python3 .ci-platform/scripts/ci/cache_fingerprint.py
          --working-directory "source/$CI_WORKING_DIRECTORY"
          --patterns-json "$CI_CACHE_KEY_FILES"

      - name: Restore build cache
        if: steps.lane.outputs.hardware_pr != 'true' && inputs.cache_paths != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ inputs.cache_paths }}
          key: reusable-ci-v4-${{ inputs.project_name }}-${{ inputs.soc }}-${{ inputs.target_os }}-${{ inputs.arch }}-${{ inputs.toolchain }}-${{ inputs.cache_key_extra }}-${{ steps.cache.outputs.fingerprint }}
          restore-keys: |
            reusable-ci-v4-${{ inputs.project_name }}-${{ inputs.soc }}-${{ inputs.target_os }}-${{ inputs.arch }}-${{ inputs.toolchain }}-${{ inputs.cache_key_extra }}-

      - name: Build
        if: steps.lane.outputs.hardware_pr != 'true'
        shell: bash
        env:
          CI_BUILD_COMMAND: ${{ inputs.build_command }}
          CI_CONTAINER_IMAGE: ${{ inputs.container_image }}
          CI_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          args=(--working-directory "source/$CI_WORKING_DIRECTORY" --command "$CI_BUILD_COMMAND")
          if [[ -n "${CI_CONTAINER_IMAGE:-}" ]]; then
            args+=(--container-image "$CI_CONTAINER_IMAGE")
          fi
          python3 .ci-platform/scripts/ci/run_build.py "${args[@]}"

      - name: Test
        if: steps.lane.outputs.hardware_pr != 'true' && inputs.test_command != ''
        shell: bash
        env:
          CI_TEST_COMMAND: ${{ inputs.test_command }}
          CI_CONTAINER_IMAGE: ${{ inputs.container_image }}
          CI_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          args=(--working-directory "source/$CI_WORKING_DIRECTORY" --command "$CI_TEST_COMMAND")
          if [[ -n "${CI_CONTAINER_IMAGE:-}" ]]; then
            args+=(--container-image "$CI_CONTAINER_IMAGE")
          fi
          python3 .ci-platform/scripts/ci/run_build.py "${args[@]}"

      - name: Prepare reusable supply-chain evidence
        run: rm -rf reusable-security-evidence && mkdir -p reusable-security-evidence

      - name: Scan caller vulnerabilities, licenses, secrets and misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Trivy v0.70.0
        with:
          scan-type: fs
          scan-ref: source/${{ inputs.working_directory }}
          scanners: vuln,license,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: reusable-security-evidence/security-scan.json
          exit-code: "0"
          version: v0.70.0

      - name: Generate caller CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Trivy v0.70.0
        with:
          scan-type: fs
          scan-ref: source/${{ inputs.working_directory }}
          format: cyclonedx
          output: reusable-security-evidence/security-sbom.cdx.json
          version: v0.70.0

      - name: Enforce caller supply-chain policy
        run: >-
          python3 .ci-platform/scripts/ci/supply_chain_policy.py
          --policy .ci-platform/ci/supply-chain-policy.json
          --skip-dockerfiles
          --report reusable-security-evidence/security-scan.json
          --sbom reusable-security-evidence/security-sbom.cdx.json

      - name: Collect build environment metadata
        if: steps.lane.outputs.hardware_pr != 'true'
        shell: bash
        env:
          CI_CONTAINER_IMAGE: ${{ inputs.container_image }}
          CI_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          args=(--working-directory "source/$CI_WORKING_DIRECTORY" --output build-environment.json)
          if [[ -n "${CI_CONTAINER_IMAGE:-}" ]]; then
            args+=(--container-image "$CI_CONTAINER_IMAGE")
          fi
          python3 .ci-platform/scripts/ci/collect_build_metadata.py "${args[@]}"

      - name: Package immutable artifact v2
        id: package
        if: steps.lane.outputs.hardware_pr != 'true'
        shell: bash
        env:
          CI_ARTIFACT_PATHS: ${{ inputs.artifact_paths_json }}
          CI_DEPENDENCY_LOCKS: ${{ inputs.dependency_lock_files_json }}
          CI_PROJECT_NAME: ${{ inputs.project_name }}
          CI_WORKING_DIRECTORY: ${{ inputs.working_directory }}
          CI_SOC: ${{ inputs.soc }}
          CI_TARGET_OS: ${{ inputs.target_os }}
          CI_ARCH: ${{ inputs.arch }}
          CI_TOOLCHAIN: ${{ inputs.toolchain }}
          CI_CONTAINER_IMAGE: ${{ inputs.container_image }}
          CI_RUNNER_LABELS: ${{ inputs.runner_labels_json }}
          CI_EXECUTION_MODE: ${{ inputs.container_image != '' && 'container' || 'host' }}
        run: |
          set -euo pipefail
          python3 .ci-platform/scripts/ci/package_artifact.py \
            --project "$CI_PROJECT_NAME" \
            --working-directory "source/$CI_WORKING_DIRECTORY" \
            --artifacts-json "$CI_ARTIFACT_PATHS" \
            --dependency-locks-json "$CI_DEPENDENCY_LOCKS" \
            --soc "$CI_SOC" \
            --target-os "$CI_TARGET_OS" \
            --arch "$CI_ARCH" \
            --toolchain "$CI_TOOLCHAIN" \
            --execution-mode "$CI_EXECUTION_MODE" \
            --container-image "$CI_CONTAINER_IMAGE" \
            --runner-labels-json "$CI_RUNNER_LABELS" \
            --build-metadata-file build-environment.json

      - name: Verify artifact
        if: steps.lane.outputs.hardware_pr != 'true'
        run: >-
          python3 .ci-platform/scripts/ci/verify_artifact.py
          --directory dist
          --expected-sha256 "${{ steps.package.outputs.digest }}"

      - name: Upload artifact and security evidence
        if: steps.lane.outputs.hardware_pr != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.bundle }}
            ${{ steps.package.outputs.manifest }}
            ${{ steps.package.outputs.checksum }}
            reusable-security-evidence/security-scan.json
            reusable-security-evidence/security-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Summary
        env:
          HARDWARE_PR: ${{ steps.lane.outputs.hardware_pr }}
          PROJECT_NAME: ${{ inputs.project_name }}
          SOC: ${{ inputs.soc }}
          TARGET_OS: ${{ inputs.target_os }}
          ARCH: ${{ inputs.arch }}
          TOOLCHAIN: ${{ inputs.toolchain }}
          EXECUTION_MODE: ${{ inputs.container_image != '' && 'container' || 'host' }}
          CONTAINER_IDENTITY: ${{ steps.container.outputs.identity || 'host execution' }}
          ARTIFACT_SHA256: ${{ steps.package.outputs.digest }}
        run: |
          {
            echo "### Reusable CI build complete"
            echo "- Project: $PROJECT_NAME"
            echo "- Target: $SOC / $TARGET_OS / $ARCH"
            echo "- Toolchain: $TOOLCHAIN"
            echo "- Supply-chain policy: PASSED"
            echo "- SBOM: CycloneDX / Trivy v0.70.0"
            if [[ "$HARDWARE_PR" == "true" ]]; then
              echo "- Execution: hosted pull-request validation lane"
              echo "- Validation: hosted-safe command completed"
              echo "- Artifact: skipped for pull-request hardware lane"
            else
              echo "- Execution: $EXECUTION_MODE"
              echo "- Container identity: $CONTAINER_IDENTITY"
              echo "- Artifact contract: v2"
              echo "- Reproducible bundle: YES"
              echo "- SHA256: $ARTIFACT_SHA256"
              echo "- Rebuild-on-promotion: NO"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
