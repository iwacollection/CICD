name: DAG Build Node

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      path:
        required: true
        type: string
      depends_on_json:
        required: false
        default: "[]"
        type: string
      soc:
        required: true
        type: string
      target_os:
        required: true
        type: string
      arch:
        required: true
        type: string
      toolchain:
        required: true
        type: string
      toolchain_identity:
        required: true
        type: string
      runner_labels_json:
        required: true
        type: string
      execution_mode:
        required: true
        type: string
      container_image:
        required: false
        default: ""
        type: string
      build_command:
        required: true
        type: string
      test_command:
        required: false
        default: ""
        type: string
      pr_validation_command:
        required: false
        default: ""
        type: string
      artifact_paths_json:
        required: true
        type: string
      dependency_lock_files_json:
        required: false
        default: "[]"
        type: string
      cache_paths:
        required: false
        default: ""
        type: string
      cache_scope:
        required: false
        default: "project"
        type: string
      cache_key_files_json:
        required: false
        default: "[]"
        type: string
      lane:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      build_parallelism:
        required: false
        default: "auto"
        type: string
      platform_ref:
        description: "Exact 40-character CICD platform commit SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.lane }} / ${{ inputs.project }} / ${{ inputs.soc }} / ${{ inputs.target_os }} / ${{ inputs.arch }}
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 120
    env:
      CI_PROJECT: ${{ inputs.project }}
      CI_ARTIFACT_NAME: ${{ inputs.artifact_name }}
      CI_TARGET: ${{ inputs.soc }}/${{ inputs.target_os }}/${{ inputs.arch }}
      CI_METRICS_KIND: build
      CI_LANE: ${{ inputs.lane }}
      CI_CCACHE_SCOPE: ${{ inputs.cache_scope }}
    steps:
      - name: Mark source checkout start
        shell: bash
        run: python3 -c 'import time; print(time.monotonic_ns())' > "$RUNNER_TEMP/ci-source-checkout-start-ns"

      - name: Checkout source
        id: source_checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          persist-credentials: false

      - name: Record source checkout duration
        shell: bash
        run: >-
          python3 source/scripts/ci/ci_metrics.py record
          --file "$RUNNER_TEMP/ci-stage-metrics.json"
          --stage source_checkout
          --start-ns "$(cat "$RUNNER_TEMP/ci-source-checkout-start-ns")"

      - name: Require immutable platform revision
        shell: bash
        env:
          CI_PLATFORM_REF: ${{ inputs.platform_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$CI_PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "platform_ref must be an exact 40-character commit SHA" >&2
            exit 1
          fi

      - name: Start platform checkout timer
        run: python3 source/scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage platform_checkout

      - name: Checkout immutable platform scripts and policy
        id: platform_checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: iwacollection/CICD
          ref: ${{ inputs.platform_ref }}
          path: .ci-platform
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            scripts/vendor
            ci
          sparse-checkout-cone-mode: true

      - name: Finish platform checkout timer
        if: always()
        continue-on-error: true
        env:
          STAGE_OUTCOME: ${{ steps.platform_checkout.outcome }}
        shell: bash
        run: |
          rc=0
          [[ "$STAGE_OUTCOME" == "success" ]] || rc=1
          python3 source/scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage platform_checkout --exit-code "$rc"


      - name: Start trust lane selection timer
        run: python3 source/scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage trust_lane_selection

      - name: Select trust lane
        id: trust
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUNNER_LABELS_JSON: ${{ inputs.runner_labels_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          labels = json.loads(os.environ["RUNNER_LABELS_JSON"])
          if not isinstance(labels, list) or not labels or not all(isinstance(x, str) and x for x in labels):
              raise SystemExit("runner_labels_json must be a non-empty JSON string array")
          hardware_pr = os.environ["EVENT_NAME"] == "pull_request" and "self-hosted" in labels
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"hardware_pr={str(hardware_pr).lower()}\n")
          PY

      - name: Finish trust lane selection timer
        if: always()
        continue-on-error: true
        env:
          STAGE_OUTCOME: ${{ steps.trust.outcome }}
        shell: bash
        run: |
          rc=0
          [[ "$STAGE_OUTCOME" == "success" ]] || rc=1
          python3 source/scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage trust_lane_selection --exit-code "$rc"

      - name: Start hardware binding timer
        run: python3 source/scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage hardware_binding

      - name: Resolve central hardware binding
        id: hardware
        shell: bash
        run: >-
          python3 .ci-platform/scripts/ci/hardware_binding.py
          --toolchain "${{ inputs.toolchain }}"

      - name: Finish hardware binding timer
        if: always()
        continue-on-error: true
        env:
          STAGE_OUTCOME: ${{ steps.hardware.outcome }}
        shell: bash
        run: |
          rc=0
          [[ "$STAGE_OUTCOME" == "success" ]] || rc=1
          python3 source/scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage hardware_binding --exit-code "$rc"

      - name: Start hosted hardware PR validation timer
        if: steps.trust.outputs.hardware_pr == 'true'
        run: python3 source/scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage hosted_hardware_pr_validation

      - name: Hosted hardware PR validation
        id: hosted_hardware_pr_validation
        if: steps.trust.outputs.hardware_pr == 'true'
        shell: bash
        env:
          CI_PR_VALIDATION_COMMAND: ${{ inputs.pr_validation_command }}
          CI_WORKING_DIRECTORY: ${{ inputs.path }}
        run: |
          set -euo pipefail
          if [[ -z "$CI_PR_VALIDATION_COMMAND" ]]; then
            echo "Self-hosted DAG target requires pr_validation_command on pull requests." >&2
            exit 1
          fi
          python3 .ci-platform/scripts/ci/run_build.py \
            --working-directory "source/$CI_WORKING_DIRECTORY" \
            --command "$CI_PR_VALIDATION_COMMAND"

      - name: Finish hosted hardware PR validation timer
        if: always() && steps.trust.outputs.hardware_pr == 'true'
        continue-on-error: true
        env:
          STAGE_OUTCOME: ${{ steps.hosted_hardware_pr_validation.outcome }}
        shell: bash
        run: |
          rc=0
          [[ "$STAGE_OUTCOME" == "success" ]] || rc=1
          python3 source/scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage hosted_hardware_pr_validation --exit-code "$rc"

      - name: Start hardware runner preflight timer
        if: steps.hardware.outputs.is_hardware == 'true' && steps.trust.outputs.hardware_pr != 'true'
        run: python3 source/scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage hardware_preflight

      - name: Hardware Runner and SDK preflight
        id: hardware_preflight
        if: steps.hardware.outputs.is_hardware == 'true' && steps.trust.outputs.hardware_pr != 'true'
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_WORKING_DIRECTORY: ${{ inputs.path }}
        run: >-
          python3 .ci-platform/scripts/ci/hardware_execute.py
          --profile "${{ steps.hardware.outputs.profile }}"
          --runner-labels-json '${{ inputs.runner_labels_json }}'
          --working-directory "source/$CI_WORKING_DIRECTORY"
          --check-only

      - name: Finish hardware runner preflight timer
        if: always() && steps.hardware.outputs.is_hardware == 'true' && steps.trust.outputs.hardware_pr != 'true'
        continue-on-error: true
        env:
          STAGE_OUTCOME: ${{ steps.hardware_preflight.outcome }}
        shell: bash
        run: |
          rc=0
          [[ "$STAGE_OUTCOME" == "success" ]] || rc=1
          python3 source/scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage hardware_preflight --exit-code "$rc"

      - name: Start upstream artifact download timer
        if: inputs.depends_on_json != '[]' && steps.trust.outputs.hardware_pr != 'true'
        run: python3 source/scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage upstream_artifact_download

      - name: Build direct upstream artifact pattern
        id: upstream_pattern
        if: inputs.depends_on_json != '[]' && steps.trust.outputs.hardware_pr != 'true'
        shell: bash
        env:
          CI_DEPENDS_ON: ${{ inputs.depends_on_json }}
        run: |
          set -euo pipefail
          pattern="$(python3 .ci-platform/scripts/ci/upstream_artifact_pattern.py --dependencies-json "$CI_DEPENDS_ON")"
          echo "pattern=$pattern" >> "$GITHUB_OUTPUT"
          echo "Direct upstream artifact filter: $pattern" >> "$GITHUB_STEP_SUMMARY"

      - name: Download declared upstream DAG artifacts
        id: upstream_download
        if: inputs.depends_on_json != '[]' && steps.trust.outputs.hardware_pr != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ steps.upstream_pattern.outputs.pattern }}
          path: upstream-artifacts
          merge-multiple: false

      - name: Finish upstream artifact download timer
        if: always() && inputs.depends_on_json != '[]' && steps.trust.outputs.hardware_pr != 'true'
        continue-on-error: true
        env:
          STAGE_OUTCOME: ${{ steps.upstream_download.outcome }}
        shell: bash
        run: |
          rc=0
          [[ "$STAGE_OUTCOME" == "success" ]] || rc=1
          python3 source/scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage upstream_artifact_download --exit-code "$rc"


      - name: Start upstream artifact resolution timer
        if: inputs.depends_on_json != '[]' && steps.trust.outputs.hardware_pr != 'true'
        run: python3 source/scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage upstream_artifact_resolution

      - name: Verify and stage declared upstream artifacts
        id: upstream
        if: inputs.depends_on_json != '[]' && steps.trust.outputs.hardware_pr != 'true'
        shell: bash
        env:
          CI_DEPENDS_ON: ${{ inputs.depends_on_json }}
          CI_WORKING_DIRECTORY: ${{ inputs.path }}
        run: |
          set -euo pipefail
          python3 .ci-platform/scripts/ci/resolve_upstream_artifacts.py \
            --directory upstream-artifacts \
            --dependencies-json "$CI_DEPENDS_ON" \
            --soc "${{ inputs.soc }}" \
            --target-os "${{ inputs.target_os }}" \
            --arch "${{ inputs.arch }}" \
            --destination "source/$CI_WORKING_DIRECTORY/.ci-upstream" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-repository "$GITHUB_REPOSITORY"

      - name: Finish upstream artifact resolution timer
        if: always() && inputs.depends_on_json != '[]' && steps.trust.outputs.hardware_pr != 'true'
        continue-on-error: true
        env:
          STAGE_OUTCOME: ${{ steps.upstream.outcome }}
        shell: bash
        run: |
          rc=0
          [[ "$STAGE_OUTCOME" == "success" ]] || rc=1
          python3 source/scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage upstream_artifact_resolution --exit-code "$rc"


      - name: Start cache fingerprint timer
        if: inputs.cache_paths != '' && steps.trust.outputs.hardware_pr != 'true'
        run: python3 source/scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage cache_fingerprint

      - name: Compute declared cache fingerprint
        id: cache_key
        if: inputs.cache_paths != '' && steps.trust.outputs.hardware_pr != 'true'
        shell: bash
        env:
          CI_CACHE_KEY_FILES: ${{ inputs.cache_key_files_json }}
          CI_WORKING_DIRECTORY: ${{ inputs.path }}
        run: >-
          python3 .ci-platform/scripts/ci/cache_fingerprint.py
          --working-directory "source/$CI_WORKING_DIRECTORY"
          --patterns-json "$CI_CACHE_KEY_FILES"

      - name: Finish cache fingerprint timer
        if: always() && inputs.cache_paths != '' && steps.trust.outputs.hardware_pr != 'true'
        continue-on-error: true
        env:
          STAGE_OUTCOME: ${{ steps.cache_key.outcome }}
        shell: bash
        run: |
          rc=0
          [[ "$STAGE_OUTCOME" == "success" ]] || rc=1
          python3 source/scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage cache_fingerprint --exit-code "$rc"


      - name: Start cache restore timer
        if: inputs.cache_paths != '' && steps.trust.outputs.hardware_pr != 'true'
        run: python3 source/scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage cache_restore

      - name: Restore build cache
        id: cache_restore
        if: inputs.cache_paths != '' && steps.trust.outputs.hardware_pr != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ inputs.cache_paths }}
          key: dag-ci-v4-${{ inputs.cache_scope }}-${{ inputs.cache_scope == 'toolchain' && 'shared' || inputs.project }}-${{ inputs.soc }}-${{ inputs.target_os }}-${{ inputs.arch }}-${{ inputs.toolchain_identity }}-${{ inputs.project }}-${{ steps.cache_key.outputs.fingerprint }}
          restore-keys: |
            dag-ci-v4-${{ inputs.cache_scope }}-${{ inputs.cache_scope == 'toolchain' && 'shared' || inputs.project }}-${{ inputs.soc }}-${{ inputs.target_os }}-${{ inputs.arch }}-${{ inputs.toolchain_identity }}-${{ inputs.project }}-

      - name: Finish cache restore timer
        if: always() && inputs.cache_paths != '' && steps.trust.outputs.hardware_pr != 'true'
        continue-on-error: true
        env:
          STAGE_OUTCOME: ${{ steps.cache_restore.outcome }}
        shell: bash
        run: |
          rc=0
          [[ "$STAGE_OUTCOME" == "success" ]] || rc=1
          python3 source/scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage cache_restore --exit-code "$rc"


      - name: Start toolchain image pull timer
        if: inputs.execution_mode == 'container' && steps.trust.outputs.hardware_pr != 'true'
        run: python3 source/scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage toolchain_image_pull

      - name: Pull and verify immutable toolchain
        id: container
        if: inputs.execution_mode == 'container' && steps.trust.outputs.hardware_pr != 'true'
        shell: bash
        env:
          CI_CONTAINER_IMAGE: ${{ inputs.container_image }}
        run: |
          set -euo pipefail
          if [[ ! "$CI_CONTAINER_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "Container toolchains must be pinned by immutable sha256 digest: $CI_CONTAINER_IMAGE" >&2
            exit 1
          fi
          expected="${CI_CONTAINER_IMAGE##*@}"
          repo_digests=""
          if docker image inspect "$CI_CONTAINER_IMAGE" >/dev/null 2>&1; then
            repo_digests="$(docker image inspect "$CI_CONTAINER_IMAGE" --format '{{json .RepoDigests}}')"
          fi
          if [[ "$repo_digests" != *"@$expected"* ]]; then
            echo "Immutable toolchain not present locally; pulling $expected"
            docker pull "$CI_CONTAINER_IMAGE"
            repo_digests="$(docker image inspect "$CI_CONTAINER_IMAGE" --format '{{json .RepoDigests}}')"
          else
            echo "Reusing locally cached immutable toolchain $expected"
          fi
          if [[ "$repo_digests" != *"@$expected"* ]]; then
            echo "Pulled image does not resolve to expected digest $expected" >&2
            exit 1
          fi
          echo "image=$CI_CONTAINER_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Finish toolchain image pull timer
        if: always() && inputs.execution_mode == 'container' && steps.trust.outputs.hardware_pr != 'true'
        continue-on-error: true
        env:
          STAGE_OUTCOME: ${{ steps.container.outcome }}
        shell: bash
        run: |
          rc=0
          [[ "$STAGE_OUTCOME" == "success" ]] || rc=1
          python3 source/scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage toolchain_image_pull --exit-code "$rc"


      - name: Build
        id: build
        if: steps.trust.outputs.hardware_pr != 'true' && steps.hardware.outputs.is_hardware != 'true'
        shell: bash
        env:
          CI_BUILD_COMMAND: ${{ inputs.build_command }}
          CI_CONTAINER_IMAGE: ${{ steps.container.outputs.image }}
          CI_UPSTREAM_ROOT: ${{ steps.upstream.outputs.root }}
          CI_UPSTREAM_INDEX: ${{ steps.upstream.outputs.index }}
          CI_WORKING_DIRECTORY: ${{ inputs.path }}
          CI_BUILD_JOBS: ${{ inputs.build_parallelism }}
          CI_BUILD_PHASE: build
        run: |
          set -euo pipefail
          python3 source/scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage build
          args=(--working-directory "source/$CI_WORKING_DIRECTORY" --command "$CI_BUILD_COMMAND")
          if [[ -n "${CI_CONTAINER_IMAGE:-}" ]]; then
            args+=(--container-image "$CI_CONTAINER_IMAGE")
          fi
          if python3 .ci-platform/scripts/ci/run_build.py "${args[@]}"; then
            build_rc=0
          else
            build_rc=$?
          fi
          python3 source/scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage build --exit-code "$build_rc"
          exit "$build_rc"

      - name: Start hardware build timer
        if: steps.trust.outputs.hardware_pr != 'true' && steps.hardware.outputs.is_hardware == 'true'
        run: python3 source/scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage hardware_build

      - name: Vendor build with license lease
        id: hardware_build
        if: steps.trust.outputs.hardware_pr != 'true' && steps.hardware.outputs.is_hardware == 'true'
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_UPSTREAM_ROOT: ${{ steps.upstream.outputs.root }}
          CI_UPSTREAM_INDEX: ${{ steps.upstream.outputs.index }}
          CI_WORKING_DIRECTORY: ${{ inputs.path }}
          CI_BUILD_JOBS: ${{ inputs.build_parallelism }}
        run: >-
          python3 .ci-platform/scripts/ci/hardware_execute.py
          --profile "${{ steps.hardware.outputs.profile }}"
          --runner-labels-json '${{ inputs.runner_labels_json }}'
          --working-directory "source/$CI_WORKING_DIRECTORY"
          --phase build

      - name: Finish hardware build timer
        if: always() && steps.trust.outputs.hardware_pr != 'true' && steps.hardware.outputs.is_hardware == 'true'
        continue-on-error: true
        env:
          STAGE_OUTCOME: ${{ steps.hardware_build.outcome }}
        shell: bash
        run: |
          rc=0
          [[ "$STAGE_OUTCOME" == "success" ]] || rc=1
          python3 source/scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage hardware_build --exit-code "$rc"

      - name: Test
        id: test
        if: inputs.test_command != '' && steps.trust.outputs.hardware_pr != 'true' && steps.hardware.outputs.is_hardware != 'true'
        shell: bash
        env:
          CI_TEST_COMMAND: ${{ inputs.test_command }}
          CI_CONTAINER_IMAGE: ${{ steps.container.outputs.image }}
          CI_UPSTREAM_ROOT: ${{ steps.upstream.outputs.root }}
          CI_UPSTREAM_INDEX: ${{ steps.upstream.outputs.index }}
          CI_WORKING_DIRECTORY: ${{ inputs.path }}
          CI_BUILD_JOBS: ${{ inputs.build_parallelism }}
          CI_BUILD_PHASE: test
        run: |
          set -euo pipefail
          python3 source/scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage test
          args=(--working-directory "source/$CI_WORKING_DIRECTORY" --command "$CI_TEST_COMMAND")
          if [[ -n "${CI_CONTAINER_IMAGE:-}" ]]; then
            args+=(--container-image "$CI_CONTAINER_IMAGE")
          fi
          if python3 .ci-platform/scripts/ci/run_build.py "${args[@]}"; then
            test_rc=0
          else
            test_rc=$?
          fi
          python3 source/scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage test --exit-code "$test_rc"
          exit "$test_rc"

      - name: Start hardware test timer
        if: inputs.test_command != '' && steps.trust.outputs.hardware_pr != 'true' && steps.hardware.outputs.is_hardware == 'true'
        run: python3 source/scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage hardware_test

      - name: HIL test with device lease
        id: hardware_test
        if: inputs.test_command != '' && steps.trust.outputs.hardware_pr != 'true' && steps.hardware.outputs.is_hardware == 'true'
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_UPSTREAM_ROOT: ${{ steps.upstream.outputs.root }}
          CI_UPSTREAM_INDEX: ${{ steps.upstream.outputs.index }}
          CI_WORKING_DIRECTORY: ${{ inputs.path }}
          CI_BUILD_JOBS: ${{ inputs.build_parallelism }}
        run: >-
          python3 .ci-platform/scripts/ci/hardware_execute.py
          --profile "${{ steps.hardware.outputs.profile }}"
          --runner-labels-json '${{ inputs.runner_labels_json }}'
          --working-directory "source/$CI_WORKING_DIRECTORY"
          --phase test

      - name: Finish hardware test timer
        if: always() && inputs.test_command != '' && steps.trust.outputs.hardware_pr != 'true' && steps.hardware.outputs.is_hardware == 'true'
        continue-on-error: true
        env:
          STAGE_OUTCOME: ${{ steps.hardware_test.outcome }}
        shell: bash
        run: |
          rc=0
          [[ "$STAGE_OUTCOME" == "success" ]] || rc=1
          python3 source/scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage hardware_test --exit-code "$rc"

      - name: Start build metadata timer
        if: steps.trust.outputs.hardware_pr != 'true'
        run: python3 source/scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage build_metadata

      - name: Collect build environment metadata
        id: build_metadata
        if: steps.trust.outputs.hardware_pr != 'true'
        shell: bash
        env:
          CI_CONTAINER_IMAGE: ${{ steps.container.outputs.image }}
          CI_WORKING_DIRECTORY: ${{ inputs.path }}
        run: |
          set -euo pipefail
          args=(--working-directory "source/$CI_WORKING_DIRECTORY" --output build-environment.json)
          if [[ -n "${CI_CONTAINER_IMAGE:-}" ]]; then
            args+=(--container-image "$CI_CONTAINER_IMAGE")
          fi
          python3 .ci-platform/scripts/ci/collect_build_metadata.py "${args[@]}"

      - name: Finish build metadata timer
        if: always() && steps.trust.outputs.hardware_pr != 'true'
        continue-on-error: true
        env:
          STAGE_OUTCOME: ${{ steps.build_metadata.outcome }}
        shell: bash
        run: |
          rc=0
          [[ "$STAGE_OUTCOME" == "success" ]] || rc=1
          python3 source/scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage build_metadata --exit-code "$rc"

      - name: Start artifact package timer
        if: steps.trust.outputs.hardware_pr != 'true'
        run: python3 source/scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage artifact_package


      - name: Package immutable Artifact Contract v2
        id: package
        if: steps.trust.outputs.hardware_pr != 'true'
        shell: bash
        env:
          CI_ARTIFACT_PATHS: ${{ inputs.artifact_paths_json }}
          CI_DEPENDENCY_LOCKS: ${{ inputs.dependency_lock_files_json }}
          CI_RUNNER_LABELS: ${{ inputs.runner_labels_json }}
          CI_CONTAINER_IMAGE: ${{ inputs.container_image }}
          CI_UPSTREAM_INDEX: ${{ steps.upstream.outputs.index }}
          CI_WORKING_DIRECTORY: ${{ inputs.path }}
        run: |
          set -euo pipefail
          args=(
            --project "${{ inputs.project }}"
            --working-directory "source/$CI_WORKING_DIRECTORY"
            --artifacts-json "$CI_ARTIFACT_PATHS"
            --dependency-locks-json "$CI_DEPENDENCY_LOCKS"
            --soc "${{ inputs.soc }}"
            --target-os "${{ inputs.target_os }}"
            --arch "${{ inputs.arch }}"
            --toolchain "${{ inputs.toolchain }}"
            --toolchain-identity "${{ inputs.toolchain_identity }}"
            --execution-mode "${{ inputs.execution_mode }}"
            --container-image "$CI_CONTAINER_IMAGE"
            --runner-labels-json "$CI_RUNNER_LABELS"
            --build-metadata-file build-environment.json
          )
          if [[ -n "${CI_UPSTREAM_INDEX:-}" ]]; then
            args+=(--upstream-index "$CI_UPSTREAM_INDEX")
          fi
          python3 .ci-platform/scripts/ci/package_artifact.py "${args[@]}"

      - name: Finish artifact package timer
        if: always() && steps.trust.outputs.hardware_pr != 'true'
        continue-on-error: true
        env:
          STAGE_OUTCOME: ${{ steps.package.outcome }}
        shell: bash
        run: |
          rc=0
          [[ "$STAGE_OUTCOME" == "success" ]] || rc=1
          python3 source/scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage artifact_package --exit-code "$rc"

      - name: Start artifact verification timer
        if: steps.trust.outputs.hardware_pr != 'true'
        run: python3 source/scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage artifact_verify


      - name: Verify packaged artifact
        id: artifact_verify
        if: steps.trust.outputs.hardware_pr != 'true'
        run: >-
          python3 .ci-platform/scripts/ci/verify_artifact.py
          --directory dist
          --expected-sha256 "${{ steps.package.outputs.digest }}"

      - name: Finish artifact verify timer
        if: always() && steps.trust.outputs.hardware_pr != 'true'
        continue-on-error: true
        env:
          STAGE_OUTCOME: ${{ steps.artifact_verify.outcome }}
        shell: bash
        run: |
          rc=0
          [[ "$STAGE_OUTCOME" == "success" ]] || rc=1
          python3 source/scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage artifact_verify --exit-code "$rc"

      - name: Start artifact upload timer
        if: steps.trust.outputs.hardware_pr != 'true'
        run: python3 source/scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage artifact_upload


      - name: Upload DAG artifact
        id: artifact_upload
        if: steps.trust.outputs.hardware_pr != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dag-${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.bundle }}
            ${{ steps.package.outputs.manifest }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Finish artifact upload timer
        if: always() && steps.trust.outputs.hardware_pr != 'true'
        continue-on-error: true
        env:
          STAGE_OUTCOME: ${{ steps.artifact_upload.outcome }}
        shell: bash
        run: |
          rc=0
          [[ "$STAGE_OUTCOME" == "success" ]] || rc=1
          python3 source/scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage artifact_upload --exit-code "$rc"

      - name: Save build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.cache_paths != '' && steps.trust.outputs.hardware_pr != 'true' && steps.cache_restore.outputs.cache-hit != 'true' && (steps.build.outcome == 'success' || steps.hardware_build.outcome == 'success') && (inputs.test_command == '' || steps.test.outcome == 'success' || steps.hardware_test.outcome == 'success') && steps.artifact_verify.outcome == 'success' && steps.artifact_upload.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ inputs.cache_paths }}
          key: dag-ci-v4-${{ inputs.cache_scope }}-${{ inputs.cache_scope == 'toolchain' && 'shared' || inputs.project }}-${{ inputs.soc }}-${{ inputs.target_os }}-${{ inputs.arch }}-${{ inputs.toolchain_identity }}-${{ inputs.project }}-${{ steps.cache_key.outputs.fingerprint }}


      - name: DAG node summary
        shell: bash
        run: |
          {
            echo "### DAG node"
            echo "- Project: ${{ inputs.project }}"
            echo "- Target: ${{ inputs.soc }} / ${{ inputs.target_os }} / ${{ inputs.arch }}"
            echo "- Depends on: ${{ inputs.depends_on_json }}"
            echo "- Hardware profile: ${{ steps.hardware.outputs.profile || 'none' }}"
            echo "- Upstream fingerprint: ${{ steps.upstream.outputs.fingerprint || 'root-node' }}"
            if [[ "${{ steps.trust.outputs.hardware_pr }}" == "true" ]]; then
              echo "- Execution: hosted-safe PR validation only"
            else
              echo "- Artifact contract: v2"
              echo "- Artifact: dag-${{ steps.package.outputs.artifact_name }}"
              echo "- SHA256: ${{ steps.package.outputs.digest }}"
              echo "- Security evidence: detached per-target Trivy/SBOM job; final gate required"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach compiler cache and CMake/Ninja telemetry
        if: always() && steps.source_checkout.outcome == 'success' && steps.trust.outputs.hardware_pr != 'true'
        continue-on-error: true
        env:
          CI_WORKING_DIRECTORY: ${{ inputs.path }}
        run: |
          python3 source/scripts/ci/ci_metrics.py attach-build-telemetry \
            --file "$RUNNER_TEMP/ci-stage-metrics.json" \
            --telemetry-file "source/$CI_WORKING_DIRECTORY/.ci-telemetry"

      - name: Finalize CI stage metrics
        if: always() && steps.source_checkout.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 source/scripts/ci/ci_metrics.py finalize \
            --file "$RUNNER_TEMP/ci-stage-metrics.json" \
            --output-json ci-stage-metrics.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload CI stage metrics
        if: always() && steps.source_checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-metrics-build-${{ inputs.artifact_name }}
          path: ci-stage-metrics.json
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
