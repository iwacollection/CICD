name: RK SDK Enrollment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rk-sdk-enrollment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover planned RK profile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "RK SDK enrollment may only run from refs/heads/main" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate RK-first rollout policy
        run: python3 scripts/ci/hardware_catalog.py

      - name: Render planned RK profile
        id: matrix
        run: python3 scripts/ci/hardware_catalog.py --matrix --status planned --soc rk

      - name: Require exactly one planned RK profile
        env:
          PLANNED_COUNT: ${{ steps.matrix.outputs.count }}
        run: |
          if [[ "$PLANNED_COUNT" != "1" ]]; then
            echo "RK SDK enrollment requires exactly one planned RK profile; found $PLANNED_COUNT" >&2
            exit 1
          fi

  enroll:
    name: ${{ matrix.profile }} / capture RK SDK identity
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require real self-hosted RK Runner
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == "self-hosted" ]] || { echo "RK enrollment requires self-hosted Runner" >&2; exit 1; }
          for tool in bash python3 git ccache; do
            command -v "$tool" >/dev/null || { echo "Missing RK Runner tool: $tool" >&2; exit 1; }
          done
          [[ -n "${RK_SDK_ROOT:-}" ]] || { echo "RK_SDK_ROOT is not configured on the Runner service" >&2; exit 1; }
          [[ -d "$RK_SDK_ROOT" ]] || { echo "RK_SDK_ROOT does not exist: $RK_SDK_ROOT" >&2; exit 1; }

      - name: Inspect canonical RK SDK identity
        id: sdk
        shell: bash
        run: >-
          python3 scripts/ci/sdk_identity.py inspect
          --sdk-root "$RK_SDK_ROOT"
          --github-output "$GITHUB_OUTPUT"

      - name: Enrollment summary
        shell: bash
        run: |
          {
            echo "### RK SDK enrollment"
            echo "- Profile: ${{ matrix.profile }}"
            echo "- SDK ID: ${{ steps.sdk.outputs.sdk_id }}"
            echo "- SDK version: ${{ steps.sdk.outputs.sdk_version }}"
            echo "- SDK identity: ${{ steps.sdk.outputs.sdk_identity }}"
            echo ""
            echo "Pin this exact SDK identity into both:"
            echo "1. ci/hardware-profiles.json -> rk-linux-arm64-lab.sdk.expected_sha256"
            echo "2. ci/toolchains.json -> rk-sdk-2026.08.host_identity"
            echo ""
            echo "Do not enable the RK project target until RK Hardware Runner Readiness passes from main."
          } >> "$GITHUB_STEP_SUMMARY"
