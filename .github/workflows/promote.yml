name: Promote Existing Artifact

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Workflow run ID that produced the artifact"
        required: true
        type: string
      artifact_name:
        description: "Exact artifact name from the build run"
        required: true
        type: string
      expected_sha256:
        description: "Expected SHA256 from the build summary/manifest"
        required: true
        type: string
      target_environment:
        description: "Promotion target"
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - production

permissions:
  actions: read
  contents: read

concurrency:
  group: promote-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote to ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Checkout platform verifier
        uses: actions/checkout@v4

      - name: Download exact existing artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: incoming
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Verify digest and manifest
        run: >-
          python3 scripts/ci/verify_artifact.py
          --directory incoming
          --expected-sha256 "${{ inputs.expected_sha256 }}"

      - name: Re-publish same bytes as promoted record
        uses: actions/upload-artifact@v4
        with:
          name: promoted-${{ inputs.target_environment }}-${{ inputs.artifact_name }}
          path: incoming/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Promotion summary
        run: |
          {
            echo "### Artifact promotion"
            echo "- Source run: ${{ inputs.source_run_id }}"
            echo "- Artifact: ${{ inputs.artifact_name }}"
            echo "- Target: ${{ inputs.target_environment }}"
            echo "- Verified SHA256: ${{ inputs.expected_sha256 }}"
            echo "- Rebuild: NO"
          } >> "$GITHUB_STEP_SUMMARY"
