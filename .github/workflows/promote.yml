name: Promote Archived Artifact

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Trusted main Build Matrix run ID that originally produced the artifact"
        required: true
        type: string
      artifact_name:
        description: "Exact Artifact Contract v2 artifact name"
        required: true
        type: string
      expected_sha256:
        description: "Exact archived bundle SHA256"
        required: true
        type: string
      target_environment:
        description: "Promotion target"
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - production

permissions:
  actions: read
  attestations: read
  contents: read
  deployments: write

concurrency:
  group: promote-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote to ${{ inputs.target_environment }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Checkout platform verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 / cosign v3.0.6
        with:
          cosign-release: v3.0.6

      - name: Validate source workflow run
        id: source
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci/validate_promotion_source.py
          --run-id "$SOURCE_RUN_ID"
          --artifact-name "$ARTIFACT_NAME"
          --expected-sha256 "$EXPECTED_SHA256"
          --repository "$GITHUB_REPOSITORY"

      - name: Download from long-term immutable archive
        id: archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/ci/artifact_archive.py download \
            --directory incoming \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-name "$ARTIFACT_NAME" \
            --expected-sha256 "$EXPECTED_SHA256"

      - name: Enforce ordered promotion path
        id: promotion_path
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_TAG: ${{ steps.archive.outputs.release_tag }}
        run: >-
          python3 scripts/ci/promotion_policy.py
          --policy ci/promotion-policy.json
          verify
          --repository "$GITHUB_REPOSITORY"
          --target-environment "$TARGET_ENVIRONMENT"
          --artifact-name "$ARTIFACT_NAME"
          --bundle-sha256 "$EXPECTED_SHA256"
          --source-sha "$SOURCE_SHA"
          --source-run-id "$SOURCE_RUN_ID"
          --release-tag "$RELEASE_TAG"

      - name: Verify archived bytes and manifest identity
        shell: bash
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: >-
          python3 scripts/ci/verify_artifact.py
          --directory incoming
          --expected-sha256 "$EXPECTED_SHA256"
          --expected-source-sha "$SOURCE_SHA"
          --expected-run-id "$SOURCE_RUN_ID"
          --expected-repository "$GITHUB_REPOSITORY"

      - name: Enforce archived supply-chain policy
        run: >-
          python3 scripts/ci/supply_chain_policy.py
          --skip-dockerfiles
          --report incoming/security-scan.json
          --sbom incoming/security-sbom.cdx.json

      - name: Verify GitHub attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find incoming -type f -name '*.tar.gz' -print)
          mapfile -t manifests < <(find incoming -type f -name '*.manifest.json' -print)
          if [[ "${#bundles[@]}" -ne 1 || "${#manifests[@]}" -ne 1 ]]; then
            echo "Expected exactly one bundle and one manifest in long-term archive" >&2
            exit 1
          fi
          gh attestation verify "${bundles[0]}" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "${manifests[0]}" --repo "$GITHUB_REPOSITORY"
          gh attestation verify incoming/security-scan.json --repo "$GITHUB_REPOSITORY"
          gh attestation verify incoming/security-sbom.cdx.json --repo "$GITHUB_REPOSITORY"

      - name: Verify Cosign signatures from archive workflow
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find incoming -maxdepth 1 -type f -name '*.tar.gz' -print)
          mapfile -t manifests < <(find incoming -maxdepth 1 -type f -name '*.manifest.json' -print)
          if [[ "${#bundles[@]}" -ne 1 || "${#manifests[@]}" -ne 1 ]]; then
            echo "Expected exactly one signed bundle and manifest" >&2
            exit 1
          fi
          identity="^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/archive-artifacts\\.yml@refs/heads/main$"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify-blob \
            --bundle "${bundles[0]}.sigstore.json" \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "${bundles[0]}"
          cosign verify-blob \
            --bundle "${manifests[0]}.sigstore.json" \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "${manifests[0]}"

      - name: Move environment digest pointer
        id: deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_TAG: ${{ steps.archive.outputs.release_tag }}
          PREREQUISITE_DEPLOYMENT_ID: ${{ steps.promotion_path.outputs.prerequisite_deployment_id }}
        run: |
          set -euo pipefail
          python3 scripts/ci/deployment_pointer.py create \
            --repository "$GITHUB_REPOSITORY" \
            --environment "$TARGET_ENVIRONMENT" \
            --artifact-name "$ARTIFACT_NAME" \
            --bundle-sha256 "$EXPECTED_SHA256" \
            --source-sha "$SOURCE_SHA" \
            --source-run-id "$SOURCE_RUN_ID" \
            --release-tag "$RELEASE_TAG" \
            --reason promotion \
            --promoted-from-deployment-id "$PREREQUISITE_DEPLOYMENT_ID"

      - name: Promotion summary
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          RELEASE_TAG: ${{ steps.archive.outputs.release_tag }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          PREREQUISITE_ENVIRONMENT: ${{ steps.promotion_path.outputs.prerequisite_environment }}
          PREREQUISITE_DEPLOYMENT_ID: ${{ steps.promotion_path.outputs.prerequisite_deployment_id }}
        run: |
          {
            echo "### Artifact promotion"
            echo "- Source run: $SOURCE_RUN_ID"
            echo "- Artifact: $ARTIFACT_NAME"
            echo "- Long-term release: $RELEASE_TAG"
            echo "- Target: $TARGET_ENVIRONMENT"
            if [[ -n "${PREREQUISITE_ENVIRONMENT:-}" ]]; then
              echo "- Required previous environment: $PREREQUISITE_ENVIRONMENT"
              echo "- Verified prerequisite deployment: $PREREQUISITE_DEPLOYMENT_ID"
            else
              echo "- Required previous environment: none (promotion root)"
            fi
            echo "- Deployment pointer: $DEPLOYMENT_ID"
            echo "- Verified SHA256: $EXPECTED_SHA256"
            echo "- Supply-chain policy: PASSED"
            echo "- Cosign archive signature: VERIFIED"
            echo "- Rebuild: NO"
          } >> "$GITHUB_STEP_SUMMARY"
