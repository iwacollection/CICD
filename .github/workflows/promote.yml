name: Promote Archived Artifact

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Trusted main Build Matrix run ID that originally produced the artifact"
        required: true
        type: string
      artifact_name:
        description: "Exact Artifact Contract v2 artifact name"
        required: true
        type: string
      expected_sha256:
        description: "Exact archived bundle SHA256"
        required: true
        type: string
      target_environment:
        description: "Promotion target"
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - production

permissions:
  actions: read
  attestations: read
  contents: read
  deployments: write

concurrency:
  group: promote-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote to ${{ inputs.target_environment }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Checkout platform verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate source workflow run
        id: source
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci/validate_promotion_source.py
          --run-id "$SOURCE_RUN_ID"
          --artifact-name "$ARTIFACT_NAME"
          --expected-sha256 "$EXPECTED_SHA256"
          --repository "$GITHUB_REPOSITORY"

      - name: Download from long-term immutable archive
        id: archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/ci/artifact_archive.py download \
            --directory incoming \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-name "$ARTIFACT_NAME" \
            --expected-sha256 "$EXPECTED_SHA256"

      - name: Verify archived bytes and manifest identity
        shell: bash
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: >-
          python3 scripts/ci/verify_artifact.py
          --directory incoming
          --expected-sha256 "$EXPECTED_SHA256"
          --expected-source-sha "$SOURCE_SHA"
          --expected-run-id "$SOURCE_RUN_ID"
          --expected-repository "$GITHUB_REPOSITORY"

      - name: Verify bundle and manifest provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find incoming -type f -name '*.tar.gz' -print)
          mapfile -t manifests < <(find incoming -type f -name '*.manifest.json' -print)
          if [[ "${#bundles[@]}" -ne 1 || "${#manifests[@]}" -ne 1 ]]; then
            echo "Expected exactly one bundle and one manifest in long-term archive" >&2
            exit 1
          fi
          gh attestation verify "${bundles[0]}" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "${manifests[0]}" --repo "$GITHUB_REPOSITORY"

      - name: Move environment digest pointer
        id: deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_TAG: ${{ steps.archive.outputs.release_tag }}
        run: |
          set -euo pipefail
          python3 scripts/ci/deployment_pointer.py create \
            --repository "$GITHUB_REPOSITORY" \
            --environment "$TARGET_ENVIRONMENT" \
            --artifact-name "$ARTIFACT_NAME" \
            --bundle-sha256 "$EXPECTED_SHA256" \
            --source-sha "$SOURCE_SHA" \
            --source-run-id "$SOURCE_RUN_ID" \
            --release-tag "$RELEASE_TAG" \
            --reason promotion

      - name: Promotion summary
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          RELEASE_TAG: ${{ steps.archive.outputs.release_tag }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          {
            echo "### Artifact promotion"
            echo "- Source run: $SOURCE_RUN_ID"
            echo "- Artifact: $ARTIFACT_NAME"
            echo "- Long-term release: $RELEASE_TAG"
            echo "- Target: $TARGET_ENVIRONMENT"
            echo "- Deployment pointer: $DEPLOYMENT_ID"
            echo "- Verified SHA256: $EXPECTED_SHA256"
            echo "- Rebuild: NO"
          } >> "$GITHUB_STEP_SUMMARY"
