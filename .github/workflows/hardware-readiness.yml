name: RK Hardware Runner Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rk-hardware-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover active RK hardware profile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "RK hardware readiness may only run from refs/heads/main" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate RK-first rollout policy
        run: |
          python3 scripts/ci/hardware_catalog.py
          python3 scripts/ci/toolchain_catalog.py
          python3 scripts/ci/validate_config.py

      - name: Render active RK hardware matrix
        id: matrix
        run: python3 scripts/ci/hardware_catalog.py --matrix --status active --soc rk

      - name: Require exactly one active RK profile
        env:
          ACTIVE_COUNT: ${{ steps.matrix.outputs.count }}
        run: |
          if [[ "$ACTIVE_COUNT" != "1" ]]; then
            echo "RK-first rollout requires exactly one active RK profile; found $ACTIVE_COUNT" >&2
            exit 1
          fi

  readiness:
    name: ${{ matrix.profile }} / RK SDK + HIL readiness
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify RK Runner, SDK identity and HIL broker configuration
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: >-
          python3 scripts/ci/hardware_execute.py
          --catalog ci/hardware-profiles.json
          --profile "${{ matrix.profile }}"
          --runner-labels-json '${{ matrix.runner_labels }}'
          --working-directory .
          --check-only
