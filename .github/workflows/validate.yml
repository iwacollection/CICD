name: Platform Validate

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "ci/**"
      - "scripts/ci/**"
      - "scripts/vendor/**"
      - "tests/**"
      - "docker/**"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate CI platform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show runtime
        run: python3 --version

      - name: Validate toolchain and hardware catalogs
        run: |
          python3 scripts/ci/toolchain_catalog.py
          python3 scripts/ci/hardware_catalog.py

      - name: Validate project catalog
        run: python3 scripts/ci/validate_config.py

      - name: Validate dependency DAG
        run: python3 scripts/ci/dependency_plan.py

      - name: Validate supply-chain dependency policy
        run: python3 scripts/ci/supply_chain_policy.py

      - name: Validate platform health SLO policy
        run: python3 scripts/ci/platform_health.py --policy ci/platform-slo.json --validate-policy

      - name: Validate promotion path policy
        run: python3 scripts/ci/promotion_policy.py --policy ci/promotion-policy.json validate

      - name: Validate repository governance policy
        run: >-
          python3 scripts/ci/repository_governance.py
          --policy ci/repository-governance-policy.json
          --validate-only

      - name: Validate business capability ownership
        run: python3 scripts/ci/capability_policy.py --policy ci/capabilities.json --repository-root .

      - name: Validate database migration policy
        run: python3 scripts/ci/db_migration_policy.py --policy ci/db-migration-policy.json --validate-policy

      - name: Render build matrix
        run: python3 scripts/ci/discover_matrix.py

      - name: Run platform unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile-check Python
        run: python3 -m compileall -q scripts/ci tests

      - name: Reproducibility gate
        id: reproducibility
        continue-on-error: true
        run: >-
          python3 scripts/ci/reproducibility_check.py
          --project hello-lib
          --soc generic
          --target-os linux
          --arch x86_64
          --toolchain gcc-host-container-v1
          --json-out reproducibility.json
          --markdown-out reproducibility.md

      - name: Publish reproducibility summary
        if: always()
        shell: bash
        run: |
          if [[ -f reproducibility.md ]]; then
            cat reproducibility.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Reproducibility Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "No reproducibility report was produced; inspect the gate step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility-${{ github.run_id }}
          path: |
            reproducibility.json
            reproducibility.md
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce reproducibility result
        if: always()
        env:
          REPRO_OUTCOME: ${{ steps.reproducibility.outcome }}
        run: |
          if [[ "$REPRO_OUTCOME" != "success" ]]; then
            echo "Reproducibility gate failed: two clean builds did not produce identical bytes or the check could not execute." >&2
            exit 1
          fi
          echo "Reproducibility gate passed."
