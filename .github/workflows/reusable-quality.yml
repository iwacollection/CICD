name: Reusable Quality

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
      working_directory:
        required: false
        default: "."
        type: string
      format_command:
        required: false
        default: ""
        type: string
      lint_command:
        required: false
        default: ""
        type: string
      static_analysis_command:
        required: false
        default: ""
        type: string
      coverage_command:
        required: false
        default: ""
        type: string
      platform_ref:
        description: "Exact 40-character CICD platform commit SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Quality / ${{ inputs.project_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout caller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          persist-credentials: false

      - name: Require immutable platform revision
        shell: bash
        env:
          CI_PLATFORM_REF: ${{ inputs.platform_ref }}
        run: |
          set -euo pipefail
          [[ "$CI_PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "platform_ref must be an exact 40-character SHA" >&2; exit 1; }

      - name: Checkout capability policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: iwacollection/CICD
          ref: ${{ inputs.platform_ref }}
          path: .ci-platform
          persist-credentials: false
          sparse-checkout: |
            ci/capabilities.json
            scripts/ci/capability_policy.py
            scripts/ci/capability_evidence.py
          sparse-checkout-cone-mode: false

      - name: Validate capability ownership
        run: python3 .ci-platform/scripts/ci/capability_policy.py --policy .ci-platform/ci/capabilities.json --repository-root .ci-platform

      - name: Require at least one quality check
        shell: bash
        env:
          FORMAT: ${{ inputs.format_command }}
          LINT: ${{ inputs.lint_command }}
          STATIC: ${{ inputs.static_analysis_command }}
          COVERAGE: ${{ inputs.coverage_command }}
        run: |
          set -euo pipefail
          if [[ -z "$FORMAT" && -z "$LINT" && -z "$STATIC" && -z "$COVERAGE" ]]; then
            echo "quality capability requires at least one command" >&2
            exit 1
          fi
          mkdir -p .ci-evidence/quality

      - name: Format check
        if: inputs.format_command != ''
        shell: bash
        env:
          CI_COMMAND: ${{ inputs.format_command }}
          CI_WORKDIR: ${{ inputs.working_directory }}
          CI_EVIDENCE_DIR: ${{ github.workspace }}/.ci-evidence/quality
        run: |
          set -euo pipefail
          cd "source/$CI_WORKDIR"
          bash -euo pipefail -c "$CI_COMMAND"

      - name: Lint
        if: inputs.lint_command != ''
        shell: bash
        env:
          CI_COMMAND: ${{ inputs.lint_command }}
          CI_WORKDIR: ${{ inputs.working_directory }}
          CI_EVIDENCE_DIR: ${{ github.workspace }}/.ci-evidence/quality
        run: |
          set -euo pipefail
          cd "source/$CI_WORKDIR"
          bash -euo pipefail -c "$CI_COMMAND"

      - name: Static analysis
        if: inputs.static_analysis_command != ''
        shell: bash
        env:
          CI_COMMAND: ${{ inputs.static_analysis_command }}
          CI_WORKDIR: ${{ inputs.working_directory }}
          CI_EVIDENCE_DIR: ${{ github.workspace }}/.ci-evidence/quality
        run: |
          set -euo pipefail
          cd "source/$CI_WORKDIR"
          bash -euo pipefail -c "$CI_COMMAND"

      - name: Coverage command
        if: inputs.coverage_command != ''
        shell: bash
        env:
          CI_COMMAND: ${{ inputs.coverage_command }}
          CI_WORKDIR: ${{ inputs.working_directory }}
          CI_EVIDENCE_DIR: ${{ github.workspace }}/.ci-evidence/quality
        run: |
          set -euo pipefail
          cd "source/$CI_WORKDIR"
          bash -euo pipefail -c "$CI_COMMAND"

      - name: Write quality evidence metadata
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: >-
          python3 .ci-platform/scripts/ci/capability_evidence.py
          --capability quality
          --project '${{ inputs.project_name }}'
          --status "$CI_JOB_STATUS"
          --output .ci-evidence/quality/capability.json

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-${{ inputs.project_name }}-${{ github.run_id }}
          path: .ci-evidence/quality
          if-no-files-found: error
          retention-days: 30
