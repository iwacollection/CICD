name: Repository Governance

on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *"

permissions:
  contents: read

concurrency:
  group: repository-governance-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Audit repository governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate governance policy
        run: >-
          python3 scripts/ci/repository_governance.py
          --policy ci/repository-governance-policy.json
          validate

      - name: Audit live GitHub Ruleset
        id: governance
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/ci/repository_governance.py
          --policy ci/repository-governance-policy.json
          audit
          --repository "$GITHUB_REPOSITORY"
          --json-out repository-governance.json
          --markdown-out repository-governance.md
          --github-output "$GITHUB_OUTPUT"
          --fail-on-drift

      - name: Publish governance summary
        if: always()
        shell: bash
        run: |
          if [[ -f repository-governance.md ]]; then
            cat repository-governance.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Repository Governance Audit" >> "$GITHUB_STEP_SUMMARY"
            echo "Governance report was not generated; inspect the audit step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-governance-${{ github.run_id }}
          path: |
            repository-governance.json
            repository-governance.md
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce governance gate
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.governance.outcome }}
          GOVERNANCE_STATUS: ${{ steps.governance.outputs.status }}
          VIOLATION_COUNT: ${{ steps.governance.outputs.violation_count }}
        run: |
          if [[ "$AUDIT_OUTCOME" != "success" ]]; then
            echo "Repository governance drift or audit failure detected; status=${GOVERNANCE_STATUS:-unknown}, violations=${VIOLATION_COUNT:-unknown}" >&2
            exit 1
          fi
          echo "Repository governance status: ${GOVERNANCE_STATUS:-healthy}; violations=${VIOLATION_COUNT:-0}"
