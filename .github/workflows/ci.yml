name: Build Matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover impacted dependency DAG
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_PROJECT: orchestration
      CI_TARGET: workflow
      CI_METRICS_KIND: discover
    outputs:
      lane: ${{ steps.impact.outputs.lane }}
      reason: ${{ steps.impact.outputs.reason }}
      changed_count: ${{ steps.impact.outputs.changed_count }}
      impacted_count: ${{ steps.impact.outputs.impacted_count }}
      level_count: ${{ steps.dag.outputs.level_count }}
      total_targets: ${{ steps.dag.outputs.total_targets }}
      levels: ${{ steps.dag.outputs.levels }}
      level_0_matrix: ${{ steps.dag.outputs.level_0_matrix }}
      level_0_count: ${{ steps.dag.outputs.level_0_count }}
      level_1_matrix: ${{ steps.dag.outputs.level_1_matrix }}
      level_1_count: ${{ steps.dag.outputs.level_1_count }}
      level_2_matrix: ${{ steps.dag.outputs.level_2_matrix }}
      level_2_count: ${{ steps.dag.outputs.level_2_count }}
      level_3_matrix: ${{ steps.dag.outputs.level_3_matrix }}
      level_3_count: ${{ steps.dag.outputs.level_3_count }}
      level_4_matrix: ${{ steps.dag.outputs.level_4_matrix }}
      level_4_count: ${{ steps.dag.outputs.level_4_count }}
      level_5_matrix: ${{ steps.dag.outputs.level_5_matrix }}
      level_5_count: ${{ steps.dag.outputs.level_5_count }}
      level_6_matrix: ${{ steps.dag.outputs.level_6_matrix }}
      level_6_count: ${{ steps.dag.outputs.level_6_count }}
      level_7_matrix: ${{ steps.dag.outputs.level_7_matrix }}
      level_7_count: ${{ steps.dag.outputs.level_7_count }}
    steps:
      - name: Mark discovery checkout start
        shell: bash
        run: python3 -c 'import time; print(time.monotonic_ns())' > "$RUNNER_TEMP/ci-source-checkout-start-ns"

      - name: Reject non-main manual dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "workflow_dispatch may only run privileged build targets from refs/heads/main" >&2
          exit 1

      - name: Checkout
        id: source_checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record discovery checkout duration
        shell: bash
        run: >-
          python3 scripts/ci/ci_metrics.py record
          --file "$RUNNER_TEMP/ci-stage-metrics.json"
          --stage source_checkout
          --start-ns "$(cat "$RUNNER_TEMP/ci-source-checkout-start-ns")"

      - name: Start catalog validation timer
        run: python3 scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage catalog_validation

      - name: Validate catalogs, DAG and supply-chain policy
        run: |
          python3 scripts/ci/toolchain_catalog.py
          python3 scripts/ci/validate_config.py
          python3 scripts/ci/dependency_plan.py
          python3 scripts/ci/supply_chain_policy.py
          python3 scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage catalog_validation

      - name: Start change detection timer
        run: python3 scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage change_detection

      - name: Detect changed files
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed_file="$RUNNER_TEMP/ci-changed-files.txt"
          : > "$changed_file"
          force_full=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            force_full=true
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "${PR_BASE_SHA:-}" || -z "${PR_HEAD_SHA:-}" ]]; then
              force_full=true
            else
              git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" -- > "$changed_file"
            fi
          else
            if [[ -z "${PUSH_BEFORE_SHA:-}" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              force_full=true
            else
              git diff --name-only "$PUSH_BEFORE_SHA" "$CURRENT_SHA" -- > "$changed_file"
            fi
          fi

          echo "changed_file=$changed_file" >> "$GITHUB_OUTPUT"
          echo "force_full=$force_full" >> "$GITHUB_OUTPUT"
          cat "$changed_file" || true
          python3 scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage change_detection

      - name: Start impact analysis timer
        run: python3 scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage impact_analysis

      - name: Analyze change impact and dependency closure
        id: impact
        shell: bash
        env:
          CHANGED_FILE: ${{ steps.changes.outputs.changed_file }}
          FORCE_FULL: ${{ steps.changes.outputs.force_full }}
        run: |
          set -euo pipefail
          args=(--changed-files-file "$CHANGED_FILE")
          if [[ "$FORCE_FULL" == "true" ]]; then
            args+=(--force-full)
          fi
          python3 scripts/ci/impact_analysis.py "${args[@]}"
          python3 scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage impact_analysis

      - name: Start DAG planning timer
        run: python3 scripts/ci/ci_metrics.py start --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage dag_planning

      - name: Render executable DAG matrices
        id: dag
        shell: bash
        env:
          IMPACTED_PROJECTS: ${{ steps.impact.outputs.projects }}
          CI_LANE: ${{ steps.impact.outputs.lane }}
        run: |
          set -euo pipefail
          python3 scripts/ci/dag_plan.py \
            --projects-json "$IMPACTED_PROJECTS" \
            --lane "$CI_LANE"
          python3 scripts/ci/ci_metrics.py finish --file "$RUNNER_TEMP/ci-stage-metrics.json" --stage dag_planning

      - name: DAG summary
        run: |
          {
            echo "### Dependency DAG"
            echo "- Lane: ${{ steps.impact.outputs.lane }}"
            echo "- Changed files: ${{ steps.impact.outputs.changed_count }}"
            echo "- Impacted projects (including prerequisites): ${{ steps.impact.outputs.impacted_count }}"
            echo "- DAG levels: ${{ steps.dag.outputs.level_count }}"
            echo "- Matrix targets: ${{ steps.dag.outputs.total_targets }}"
            echo "- Levels: ${{ steps.dag.outputs.levels }}"
            echo "- Decision: ${{ steps.impact.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Finalize discovery stage metrics
        if: always() && steps.source_checkout.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/ci_metrics.py finalize \
            --file "$RUNNER_TEMP/ci-stage-metrics.json" \
            --output-json ci-stage-metrics.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload discovery stage metrics
        if: always() && steps.source_checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-metrics-discover
          path: ci-stage-metrics.json
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  level_0:
    name: DAG L0 / ${{ matrix.project }} / ${{ matrix.soc }} / ${{ matrix.target_os }} / ${{ matrix.arch }}
    needs: discover
    if: needs.discover.outputs.level_0_count != '0'
