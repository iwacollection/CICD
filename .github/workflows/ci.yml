name: Build Matrix

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "ci/**"
      - "docker/**"
      - "scripts/ci/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "examples/**"
      - "ci/**"
      - "docker/**"
      - "scripts/ci/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate catalog
        run: python3 scripts/ci/validate_config.py

      - name: Build matrix
        id: matrix
        run: python3 scripts/ci/discover_matrix.py

  build:
    name: ${{ matrix.project }} / ${{ matrix.soc }} / ${{ matrix.target_os }} / ${{ matrix.arch }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore build cache
        if: matrix.cache_paths != ''
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache_paths }}
          key: ci-v2-${{ matrix.project }}-${{ matrix.soc }}-${{ matrix.target_os }}-${{ matrix.arch }}-${{ matrix.toolchain }}-${{ hashFiles('docker/**/Dockerfile', '**/CMakeLists.txt', '**/deps.lock', '**/toolchain.lock', '**/package-lock.json', '**/pnpm-lock.yaml', '**/go.sum', '**/poetry.lock', '**/uv.lock', '**/Cargo.lock', '**/requirements*.txt') }}
          restore-keys: |
            ci-v2-${{ matrix.project }}-${{ matrix.soc }}-${{ matrix.target_os }}-${{ matrix.arch }}-${{ matrix.toolchain }}-

      - name: Prepare toolchain container
        id: container
        if: matrix.execution_mode == 'container'
        shell: bash
        env:
          CI_CONTAINER_IMAGE: ${{ matrix.container_image }}
          CI_CONTAINER_DOCKERFILE: ${{ matrix.container_dockerfile }}
        run: |
          set -euo pipefail
          if [[ -n "$CI_CONTAINER_DOCKERFILE" ]]; then
            image="ci-toolchain:${GITHUB_SHA::12}-${{ strategy.job-index }}"
            docker build --pull -f "$CI_CONTAINER_DOCKERFILE" -t "$image" .
            identity="$(docker image inspect "$image" --format '{{.Id}}')"
          else
            image="$CI_CONTAINER_IMAGE"
            docker pull "$image"
            identity="$(docker image inspect "$image" --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}{{.Id}}{{end}}')"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "Using toolchain container: $identity"

      - name: Build
        shell: bash
        env:
          CI_BUILD_COMMAND: ${{ matrix.build_command }}
          CI_CONTAINER_IMAGE: ${{ steps.container.outputs.image }}
        run: |
          set -euo pipefail
          args=(--working-directory "${{ matrix.path }}" --command "$CI_BUILD_COMMAND")
          if [[ -n "${CI_CONTAINER_IMAGE:-}" ]]; then
            args+=(--container-image "$CI_CONTAINER_IMAGE")
          fi
          python3 scripts/ci/run_build.py "${args[@]}"

      - name: Test
        if: matrix.test_command != ''
        shell: bash
        env:
          CI_TEST_COMMAND: ${{ matrix.test_command }}
          CI_CONTAINER_IMAGE: ${{ steps.container.outputs.image }}
        run: |
          set -euo pipefail
          args=(--working-directory "${{ matrix.path }}" --command "$CI_TEST_COMMAND")
          if [[ -n "${CI_CONTAINER_IMAGE:-}" ]]; then
            args+=(--container-image "$CI_CONTAINER_IMAGE")
          fi
          python3 scripts/ci/run_build.py "${args[@]}"

      - name: Package immutable artifact
        id: package
        env:
          CI_ARTIFACT_PATHS: ${{ matrix.artifact_paths }}
        run: >-
          python3 scripts/ci/package_artifact.py
          --project "${{ matrix.project }}"
          --working-directory "${{ matrix.path }}"
          --artifacts-json "$CI_ARTIFACT_PATHS"
          --soc "${{ matrix.soc }}"
          --target-os "${{ matrix.target_os }}"
          --arch "${{ matrix.arch }}"
          --toolchain "${{ matrix.toolchain }}"

      - name: Verify packaged artifact
        run: python3 scripts/ci/verify_artifact.py --directory dist --expected-sha256 "${{ steps.package.outputs.digest }}"

      - name: Upload immutable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.bundle }}
            ${{ steps.package.outputs.manifest }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        run: |
          {
            echo "### Build complete"
            echo "- Project: ${{ matrix.project }}"
            echo "- Target: ${{ matrix.soc }} / ${{ matrix.target_os }} / ${{ matrix.arch }}"
            echo "- Toolchain: ${{ matrix.toolchain }}"
            echo "- Execution: ${{ matrix.execution_mode }}"
            echo "- Container identity: ${{ steps.container.outputs.identity || 'host execution' }}"
            echo "- Test gate: ${{ matrix.test_command != '' && 'enabled' || 'not configured' }}"
            echo "- SHA256: ${{ steps.package.outputs.digest }}"
            echo "- Artifact: ${{ steps.package.outputs.artifact_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
