name: Build Matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover impacted dependency DAG
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.impact.outputs.lane }}
      reason: ${{ steps.impact.outputs.reason }}
      changed_count: ${{ steps.impact.outputs.changed_count }}
      impacted_count: ${{ steps.impact.outputs.impacted_count }}
      level_count: ${{ steps.dag.outputs.level_count }}
      total_targets: ${{ steps.dag.outputs.total_targets }}
      levels: ${{ steps.dag.outputs.levels }}
      level_0_matrix: ${{ steps.dag.outputs.level_0_matrix }}
      level_0_count: ${{ steps.dag.outputs.level_0_count }}
      level_1_matrix: ${{ steps.dag.outputs.level_1_matrix }}
      level_1_count: ${{ steps.dag.outputs.level_1_count }}
      level_2_matrix: ${{ steps.dag.outputs.level_2_matrix }}
      level_2_count: ${{ steps.dag.outputs.level_2_count }}
      level_3_matrix: ${{ steps.dag.outputs.level_3_matrix }}
      level_3_count: ${{ steps.dag.outputs.level_3_count }}
      level_4_matrix: ${{ steps.dag.outputs.level_4_matrix }}
      level_4_count: ${{ steps.dag.outputs.level_4_count }}
      level_5_matrix: ${{ steps.dag.outputs.level_5_matrix }}
      level_5_count: ${{ steps.dag.outputs.level_5_count }}
      level_6_matrix: ${{ steps.dag.outputs.level_6_matrix }}
      level_6_count: ${{ steps.dag.outputs.level_6_count }}
      level_7_matrix: ${{ steps.dag.outputs.level_7_matrix }}
      level_7_count: ${{ steps.dag.outputs.level_7_count }}
    steps:
      - name: Reject non-main manual dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "workflow_dispatch may only run privileged build targets from refs/heads/main" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate catalogs, DAG and supply-chain policy
        run: |
          python3 scripts/ci/toolchain_catalog.py
          python3 scripts/ci/validate_config.py
          python3 scripts/ci/dependency_plan.py
          python3 scripts/ci/supply_chain_policy.py

      - name: Detect changed files
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed_file="$RUNNER_TEMP/ci-changed-files.txt"
          : > "$changed_file"
          force_full=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            force_full=true
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "${PR_BASE_SHA:-}" || -z "${PR_HEAD_SHA:-}" ]]; then
              force_full=true
            else
              git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" -- > "$changed_file"
            fi
          else
            if [[ -z "${PUSH_BEFORE_SHA:-}" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              force_full=true
            else
              git diff --name-only "$PUSH_BEFORE_SHA" "$CURRENT_SHA" -- > "$changed_file"
            fi
          fi

          echo "changed_file=$changed_file" >> "$GITHUB_OUTPUT"
          echo "force_full=$force_full" >> "$GITHUB_OUTPUT"
          cat "$changed_file" || true

      - name: Analyze change impact and dependency closure
        id: impact
        shell: bash
        env:
          CHANGED_FILE: ${{ steps.changes.outputs.changed_file }}
          FORCE_FULL: ${{ steps.changes.outputs.force_full }}
        run: |
          set -euo pipefail
          args=(--changed-files-file "$CHANGED_FILE")
          if [[ "$FORCE_FULL" == "true" ]]; then
            args+=(--force-full)
          fi
          python3 scripts/ci/impact_analysis.py "${args[@]}"

      - name: Render executable DAG matrices
        id: dag
        shell: bash
        env:
          IMPACTED_PROJECTS: ${{ steps.impact.outputs.projects }}
          CI_LANE: ${{ steps.impact.outputs.lane }}
        run: |
          set -euo pipefail
          python3 scripts/ci/dag_plan.py \
            --projects-json "$IMPACTED_PROJECTS" \
            --lane "$CI_LANE"

      - name: DAG summary
        run: |
          {
            echo "### Dependency DAG"
            echo "- Lane: ${{ steps.impact.outputs.lane }}"
            echo "- Changed files: ${{ steps.impact.outputs.changed_count }}"
            echo "- Impacted projects (including prerequisites): ${{ steps.impact.outputs.impacted_count }}"
            echo "- DAG levels: ${{ steps.dag.outputs.level_count }}"
            echo "- Matrix targets: ${{ steps.dag.outputs.total_targets }}"
            echo "- Levels: ${{ steps.dag.outputs.levels }}"
            echo "- Decision: ${{ steps.impact.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  level_0:
    name: DAG L0 / ${{ matrix.project }} / ${{ matrix.soc }} / ${{ matrix.target_os }} / ${{ matrix.arch }}
    needs: discover
    if: needs.discover.outputs.level_0_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.level_0_matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/dag-node.yml
    with:
      project: ${{ matrix.project }}
      path: ${{ matrix.path }}
      depends_on_json: ${{ matrix.depends_on }}
      soc: ${{ matrix.soc }}
      target_os: ${{ matrix.target_os }}
      arch: ${{ matrix.arch }}
      toolchain: ${{ matrix.toolchain }}
      toolchain_identity: ${{ matrix.toolchain_identity }}
      runner_labels_json: ${{ matrix.runner_labels }}
      execution_mode: ${{ matrix.execution_mode }}
      container_image: ${{ matrix.container_image }}
      build_command: ${{ matrix.build_command }}
      test_command: ${{ matrix.test_command }}
      pr_validation_command: ${{ matrix.pr_validation_command }}
      artifact_paths_json: ${{ matrix.artifact_paths }}
      dependency_lock_files_json: ${{ matrix.dependency_lock_files }}
      cache_paths: ${{ matrix.cache_paths }}
      cache_key_files_json: ${{ matrix.cache_key_files }}
      lane: ${{ matrix.lane }}
      platform_ref: ${{ github.sha }}

  level_1:
    name: DAG L1 / ${{ matrix.project }} / ${{ matrix.soc }} / ${{ matrix.target_os }} / ${{ matrix.arch }}
    needs: [discover, level_0]
    if: needs.discover.outputs.level_1_count != '0' && needs.level_0.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.level_1_matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/dag-node.yml
    with:
      project: ${{ matrix.project }}
      path: ${{ matrix.path }}
      depends_on_json: ${{ matrix.depends_on }}
      soc: ${{ matrix.soc }}
      target_os: ${{ matrix.target_os }}
      arch: ${{ matrix.arch }}
      toolchain: ${{ matrix.toolchain }}
      toolchain_identity: ${{ matrix.toolchain_identity }}
      runner_labels_json: ${{ matrix.runner_labels }}
      execution_mode: ${{ matrix.execution_mode }}
      container_image: ${{ matrix.container_image }}
      build_command: ${{ matrix.build_command }}
      test_command: ${{ matrix.test_command }}
      pr_validation_command: ${{ matrix.pr_validation_command }}
      artifact_paths_json: ${{ matrix.artifact_paths }}
      dependency_lock_files_json: ${{ matrix.dependency_lock_files }}
      cache_paths: ${{ matrix.cache_paths }}
      cache_key_files_json: ${{ matrix.cache_key_files }}
      lane: ${{ matrix.lane }}
      platform_ref: ${{ github.sha }}

  level_2:
    name: DAG L2 / ${{ matrix.project }} / ${{ matrix.soc }} / ${{ matrix.target_os }} / ${{ matrix.arch }}
    needs: [discover, level_1]
    if: needs.discover.outputs.level_2_count != '0' && needs.level_1.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.level_2_matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/dag-node.yml
    with:
      project: ${{ matrix.project }}
      path: ${{ matrix.path }}
      depends_on_json: ${{ matrix.depends_on }}
      soc: ${{ matrix.soc }}
      target_os: ${{ matrix.target_os }}
      arch: ${{ matrix.arch }}
      toolchain: ${{ matrix.toolchain }}
      toolchain_identity: ${{ matrix.toolchain_identity }}
      runner_labels_json: ${{ matrix.runner_labels }}
      execution_mode: ${{ matrix.execution_mode }}
      container_image: ${{ matrix.container_image }}
      build_command: ${{ matrix.build_command }}
      test_command: ${{ matrix.test_command }}
      pr_validation_command: ${{ matrix.pr_validation_command }}
      artifact_paths_json: ${{ matrix.artifact_paths }}
      dependency_lock_files_json: ${{ matrix.dependency_lock_files }}
      cache_paths: ${{ matrix.cache_paths }}
      cache_key_files_json: ${{ matrix.cache_key_files }}
      lane: ${{ matrix.lane }}
      platform_ref: ${{ github.sha }}

  level_3:
    name: DAG L3 / ${{ matrix.project }} / ${{ matrix.soc }} / ${{ matrix.target_os }} / ${{ matrix.arch }}
    needs: [discover, level_2]
    if: needs.discover.outputs.level_3_count != '0' && needs.level_2.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.level_3_matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/dag-node.yml
    with:
      project: ${{ matrix.project }}
      path: ${{ matrix.path }}
      depends_on_json: ${{ matrix.depends_on }}
      soc: ${{ matrix.soc }}
      target_os: ${{ matrix.target_os }}
      arch: ${{ matrix.arch }}
      toolchain: ${{ matrix.toolchain }}
      toolchain_identity: ${{ matrix.toolchain_identity }}
      runner_labels_json: ${{ matrix.runner_labels }}
      execution_mode: ${{ matrix.execution_mode }}
      container_image: ${{ matrix.container_image }}
      build_command: ${{ matrix.build_command }}
      test_command: ${{ matrix.test_command }}
      pr_validation_command: ${{ matrix.pr_validation_command }}
      artifact_paths_json: ${{ matrix.artifact_paths }}
      dependency_lock_files_json: ${{ matrix.dependency_lock_files }}
      cache_paths: ${{ matrix.cache_paths }}
      cache_key_files_json: ${{ matrix.cache_key_files }}
      lane: ${{ matrix.lane }}
      platform_ref: ${{ github.sha }}

  level_4:
    name: DAG L4 / ${{ matrix.project }} / ${{ matrix.soc }} / ${{ matrix.target_os }} / ${{ matrix.arch }}
    needs: [discover, level_3]
    if: needs.discover.outputs.level_4_count != '0' && needs.level_3.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.level_4_matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/dag-node.yml
    with:
      project: ${{ matrix.project }}
      path: ${{ matrix.path }}
      depends_on_json: ${{ matrix.depends_on }}
      soc: ${{ matrix.soc }}
      target_os: ${{ matrix.target_os }}
      arch: ${{ matrix.arch }}
      toolchain: ${{ matrix.toolchain }}
      toolchain_identity: ${{ matrix.toolchain_identity }}
      runner_labels_json: ${{ matrix.runner_labels }}
      execution_mode: ${{ matrix.execution_mode }}
      container_image: ${{ matrix.container_image }}
      build_command: ${{ matrix.build_command }}
      test_command: ${{ matrix.test_command }}
      pr_validation_command: ${{ matrix.pr_validation_command }}
      artifact_paths_json: ${{ matrix.artifact_paths }}
      dependency_lock_files_json: ${{ matrix.dependency_lock_files }}
      cache_paths: ${{ matrix.cache_paths }}
      cache_key_files_json: ${{ matrix.cache_key_files }}
      lane: ${{ matrix.lane }}
      platform_ref: ${{ github.sha }}

  level_5:
    name: DAG L5 / ${{ matrix.project }} / ${{ matrix.soc }} / ${{ matrix.target_os }} / ${{ matrix.arch }}
    needs: [discover, level_4]
    if: needs.discover.outputs.level_5_count != '0' && needs.level_4.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.level_5_matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/dag-node.yml
    with:
      project: ${{ matrix.project }}
      path: ${{ matrix.path }}
      depends_on_json: ${{ matrix.depends_on }}
      soc: ${{ matrix.soc }}
      target_os: ${{ matrix.target_os }}
      arch: ${{ matrix.arch }}
      toolchain: ${{ matrix.toolchain }}
      toolchain_identity: ${{ matrix.toolchain_identity }}
      runner_labels_json: ${{ matrix.runner_labels }}
      execution_mode: ${{ matrix.execution_mode }}
      container_image: ${{ matrix.container_image }}
      build_command: ${{ matrix.build_command }}
      test_command: ${{ matrix.test_command }}
      pr_validation_command: ${{ matrix.pr_validation_command }}
      artifact_paths_json: ${{ matrix.artifact_paths }}
      dependency_lock_files_json: ${{ matrix.dependency_lock_files }}
      cache_paths: ${{ matrix.cache_paths }}
      cache_key_files_json: ${{ matrix.cache_key_files }}
      lane: ${{ matrix.lane }}
      platform_ref: ${{ github.sha }}

  level_6:
    name: DAG L6 / ${{ matrix.project }} / ${{ matrix.soc }} / ${{ matrix.target_os }} / ${{ matrix.arch }}
    needs: [discover, level_5]
    if: needs.discover.outputs.level_6_count != '0' && needs.level_5.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.level_6_matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/dag-node.yml
    with:
      project: ${{ matrix.project }}
      path: ${{ matrix.path }}
      depends_on_json: ${{ matrix.depends_on }}
      soc: ${{ matrix.soc }}
      target_os: ${{ matrix.target_os }}
      arch: ${{ matrix.arch }}
      toolchain: ${{ matrix.toolchain }}
      toolchain_identity: ${{ matrix.toolchain_identity }}
      runner_labels_json: ${{ matrix.runner_labels }}
      execution_mode: ${{ matrix.execution_mode }}
      container_image: ${{ matrix.container_image }}
      build_command: ${{ matrix.build_command }}
      test_command: ${{ matrix.test_command }}
      pr_validation_command: ${{ matrix.pr_validation_command }}
      artifact_paths_json: ${{ matrix.artifact_paths }}
      dependency_lock_files_json: ${{ matrix.dependency_lock_files }}
      cache_paths: ${{ matrix.cache_paths }}
      cache_key_files_json: ${{ matrix.cache_key_files }}
      lane: ${{ matrix.lane }}
      platform_ref: ${{ github.sha }}

  level_7:
    name: DAG L7 / ${{ matrix.project }} / ${{ matrix.soc }} / ${{ matrix.target_os }} / ${{ matrix.arch }}
    needs: [discover, level_6]
    if: needs.discover.outputs.level_7_count != '0' && needs.level_6.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.level_7_matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/dag-node.yml
    with:
      project: ${{ matrix.project }}
      path: ${{ matrix.path }}
      depends_on_json: ${{ matrix.depends_on }}
      soc: ${{ matrix.soc }}
      target_os: ${{ matrix.target_os }}
      arch: ${{ matrix.arch }}
      toolchain: ${{ matrix.toolchain }}
      toolchain_identity: ${{ matrix.toolchain_identity }}
      runner_labels_json: ${{ matrix.runner_labels }}
      execution_mode: ${{ matrix.execution_mode }}
      container_image: ${{ matrix.container_image }}
      build_command: ${{ matrix.build_command }}
      test_command: ${{ matrix.test_command }}
      pr_validation_command: ${{ matrix.pr_validation_command }}
      artifact_paths_json: ${{ matrix.artifact_paths }}
      dependency_lock_files_json: ${{ matrix.dependency_lock_files }}
      cache_paths: ${{ matrix.cache_paths }}
      cache_key_files_json: ${{ matrix.cache_key_files }}
      lane: ${{ matrix.lane }}
      platform_ref: ${{ github.sha }}

  build_complete:
    name: Dependency DAG barrier
    needs: [discover, level_0, level_1, level_2, level_3, level_4, level_5, level_6, level_7]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Enforce every planned level
        shell: bash
        env:
          TOTAL_TARGETS: ${{ needs.discover.outputs.total_targets }}
          L0_COUNT: ${{ needs.discover.outputs.level_0_count }}
          L1_COUNT: ${{ needs.discover.outputs.level_1_count }}
          L2_COUNT: ${{ needs.discover.outputs.level_2_count }}
          L3_COUNT: ${{ needs.discover.outputs.level_3_count }}
          L4_COUNT: ${{ needs.discover.outputs.level_4_count }}
          L5_COUNT: ${{ needs.discover.outputs.level_5_count }}
          L6_COUNT: ${{ needs.discover.outputs.level_6_count }}
          L7_COUNT: ${{ needs.discover.outputs.level_7_count }}
          L0_RESULT: ${{ needs.level_0.result }}
          L1_RESULT: ${{ needs.level_1.result }}
          L2_RESULT: ${{ needs.level_2.result }}
          L3_RESULT: ${{ needs.level_3.result }}
          L4_RESULT: ${{ needs.level_4.result }}
          L5_RESULT: ${{ needs.level_5.result }}
          L6_RESULT: ${{ needs.level_6.result }}
          L7_RESULT: ${{ needs.level_7.result }}
        run: |
          set -euo pipefail
          for index in 0 1 2 3 4 5 6 7; do
            count_var="L${index}_COUNT"
            result_var="L${index}_RESULT"
            count="${!count_var}"
            result="${!result_var}"
            if [[ "$count" == "0" ]]; then
              if [[ "$result" != "skipped" && "$result" != "success" ]]; then
                echo "DAG level $index had no targets but result=$result" >&2
                exit 1
              fi
            elif [[ "$result" != "success" ]]; then
              echo "DAG level $index planned $count target(s) but result=$result" >&2
              exit 1
            fi
          done
          echo "Dependency DAG completed successfully: total_targets=$TOTAL_TARGETS"

  attest:
    name: Attest trusted DAG artifacts
    needs: [discover, build_complete]
    if: always() && github.event_name != 'pull_request' && needs.discover.result == 'success' && needs.build_complete.result == 'success' && needs.discover.outputs.total_targets != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download DAG artifacts from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dag-*
          path: provenance-input
          merge-multiple: false

      - name: Attest exact uploaded bundles
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: provenance-input/**/*.tar.gz

      - name: Attest artifact manifests
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: provenance-input/**/*.manifest.json

      - name: Attest SBOM and scan evidence
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            provenance-input/**/security-scan.json
            provenance-input/**/security-sbom.cdx.json

  gate:
    name: Build gate
    needs: [discover, build_complete, attest]
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce aggregate DAG result
        shell: bash
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          DAG_RESULT: ${{ needs.build_complete.result }}
          ATTEST_RESULT: ${{ needs.attest.result }}
          TOTAL_TARGETS: ${{ needs.discover.outputs.total_targets }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$DISCOVER_RESULT" != "success" ]]; then
            echo "DAG discovery failed: $DISCOVER_RESULT" >&2
            exit 1
          fi
          if [[ "$DAG_RESULT" != "success" ]]; then
            echo "Dependency DAG failed: $DAG_RESULT" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" != "pull_request" && "$TOTAL_TARGETS" != "0" && "$ATTEST_RESULT" != "success" ]]; then
            echo "Trusted DAG artifact attestation failed: $ATTEST_RESULT" >&2
            exit 1
          fi
          echo "Build gate passed: total_targets=$TOTAL_TARGETS dag_result=$DAG_RESULT"
