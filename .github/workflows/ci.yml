    permissions:
      contents: read
    uses: ./.github/workflows/dag-security.yml
    with:
      artifact_name: ${{ matrix.artifact_name }}
      project: ${{ matrix.project }}
      path: ${{ matrix.path }}
      soc: ${{ matrix.soc }}
      target_os: ${{ matrix.target_os }}
      arch: ${{ matrix.arch }}
      toolchain: ${{ matrix.toolchain }}
      toolchain_identity: ${{ matrix.toolchain_identity }}
      platform_ref: ${{ github.sha }}
      lane: ${{ matrix.lane }}

  build_complete:
    name: Dependency DAG barrier
    needs: [discover, level_0, level_1, level_2, level_3, level_4, level_5, level_6, level_7]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Enforce every planned level
        shell: bash
        env:
          TOTAL_TARGETS: ${{ needs.discover.outputs.total_targets }}
          L0_COUNT: ${{ needs.discover.outputs.level_0_count }}
          L1_COUNT: ${{ needs.discover.outputs.level_1_count }}
          L2_COUNT: ${{ needs.discover.outputs.level_2_count }}
          L3_COUNT: ${{ needs.discover.outputs.level_3_count }}
          L4_COUNT: ${{ needs.discover.outputs.level_4_count }}
          L5_COUNT: ${{ needs.discover.outputs.level_5_count }}
          L6_COUNT: ${{ needs.discover.outputs.level_6_count }}
          L7_COUNT: ${{ needs.discover.outputs.level_7_count }}
          L0_RESULT: ${{ needs.level_0.result }}
          L1_RESULT: ${{ needs.level_1.result }}
          L2_RESULT: ${{ needs.level_2.result }}
          L3_RESULT: ${{ needs.level_3.result }}
          L4_RESULT: ${{ needs.level_4.result }}
          L5_RESULT: ${{ needs.level_5.result }}
          L6_RESULT: ${{ needs.level_6.result }}
          L7_RESULT: ${{ needs.level_7.result }}
        run: |
          set -euo pipefail
          for index in 0 1 2 3 4 5 6 7; do
            count_var="L${index}_COUNT"
            result_var="L${index}_RESULT"
            count="${!count_var}"
            result="${!result_var}"
            if [[ "$count" == "0" ]]; then
              if [[ "$result" != "skipped" && "$result" != "success" ]]; then
                echo "DAG level $index had no targets but result=$result" >&2
                exit 1
              fi
            elif [[ "$result" != "success" ]]; then
              echo "DAG level $index planned $count target(s) but result=$result" >&2
              exit 1
            fi
          done
          echo "Dependency DAG completed successfully: total_targets=$TOTAL_TARGETS"

  security_complete:
    name: Detached security evidence barrier
    needs: [discover, security_level_0, security_level_1, security_level_2, security_level_3, security_level_4, security_level_5, security_level_6, security_level_7]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Enforce security evidence for every planned target
        shell: bash
        env:
          S0_COUNT: ${{ needs.discover.outputs.level_0_count }}
          S1_COUNT: ${{ needs.discover.outputs.level_1_count }}
          S2_COUNT: ${{ needs.discover.outputs.level_2_count }}
          S3_COUNT: ${{ needs.discover.outputs.level_3_count }}
          S4_COUNT: ${{ needs.discover.outputs.level_4_count }}
          S5_COUNT: ${{ needs.discover.outputs.level_5_count }}
          S6_COUNT: ${{ needs.discover.outputs.level_6_count }}
          S7_COUNT: ${{ needs.discover.outputs.level_7_count }}
          S0_RESULT: ${{ needs.security_level_0.result }}
          S1_RESULT: ${{ needs.security_level_1.result }}
          S2_RESULT: ${{ needs.security_level_2.result }}
          S3_RESULT: ${{ needs.security_level_3.result }}
          S4_RESULT: ${{ needs.security_level_4.result }}
          S5_RESULT: ${{ needs.security_level_5.result }}
          S6_RESULT: ${{ needs.security_level_6.result }}
          S7_RESULT: ${{ needs.security_level_7.result }}
        run: |
          set -euo pipefail
          for index in 0 1 2 3 4 5 6 7; do
            count_var="S${index}_COUNT"
            result_var="S${index}_RESULT"
            count="${!count_var}"
            result="${!result_var}"
            if [[ "$count" == "0" ]]; then
              if [[ "$result" != "skipped" && "$result" != "success" ]]; then
                echo "Security level $index had no targets but result=$result" >&2
                exit 1
              fi
            elif [[ "$result" != "success" ]]; then
              echo "Security level $index planned $count target(s) but result=$result" >&2
              exit 1
            fi
          done
          echo "Detached security evidence completed for all planned targets."

  attest:
    name: Attest trusted DAG artifacts
    needs: [discover, build_complete, security_complete]
    if: always() && github.event_name != 'pull_request' && needs.discover.result == 'success' && needs.build_complete.result == 'success' && needs.security_complete.result == 'success' && needs.discover.outputs.total_targets != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download DAG artifacts from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dag-*
          path: provenance-input
          merge-multiple: false

      - name: Download detached security evidence from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: security-*
          path: provenance-security
          merge-multiple: false

      - name: Attest exact uploaded bundles
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: provenance-input/**/*.tar.gz

      - name: Attest artifact manifests
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: provenance-input/**/*.manifest.json

      - name: Attest SBOM and scan evidence
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            provenance-security/**/security-scan.json
            provenance-security/**/security-sbom.cdx.json
            provenance-security/**/security-evidence.json

  performance_report:
    name: Aggregate CI stage timings
    needs: [discover, build_complete, security_complete]
    if: always() && needs.discover.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout report generator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download per-job timing artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ci-metrics-*
          path: metrics-input
          merge-multiple: false

      - name: Aggregate stage timing report
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/ci_metrics.py aggregate \
            --input-dir metrics-input \
            --output-json ci-performance-report.json \
            --output-markdown ci-performance-report.md
          cat ci-performance-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow performance report
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-performance-report
          path: |
            ci-performance-report.json
            ci-performance-report.md
          if-no-files-found: error
          retention-days: 30

  gate:
    name: Build gate
    needs: [discover, build_complete, security_complete, attest]
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce aggregate DAG result
        shell: bash
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          DAG_RESULT: ${{ needs.build_complete.result }}
          SECURITY_RESULT: ${{ needs.security_complete.result }}
          ATTEST_RESULT: ${{ needs.attest.result }}
          TOTAL_TARGETS: ${{ needs.discover.outputs.total_targets }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$DISCOVER_RESULT" != "success" ]]; then
            echo "DAG discovery failed: $DISCOVER_RESULT" >&2
            exit 1
          fi
          if [[ "$DAG_RESULT" != "success" ]]; then
            echo "Dependency DAG failed: $DAG_RESULT" >&2
            exit 1
          fi
          if [[ "$SECURITY_RESULT" != "success" ]]; then
            echo "Detached security evidence failed: $SECURITY_RESULT" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" != "pull_request" && "$TOTAL_TARGETS" != "0" && "$ATTEST_RESULT" != "success" ]]; then
            echo "Trusted DAG artifact attestation failed: $ATTEST_RESULT" >&2
            exit 1
          fi
          echo "Build gate passed: total_targets=$TOTAL_TARGETS dag_result=$DAG_RESULT"


  performance_regression:
    name: Mainline CI performance regression monitor
    needs: [discover, performance_report, gate]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.discover.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout performance monitor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .ci-monitor
          persist-credentials: false

      - name: Download current Build Matrix performance report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-performance-report
          path: current-metrics
          if-no-files-found: warn

      - name: Compare mainline P95, scan time and failure rate
        env:
          CI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_CURRENT_RUN_ID: ${{ github.run_id }}
          CI_CURRENT_CONCLUSION: ${{ needs.gate.result }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci-monitor/scripts/ci/performance_regression.py \
            --repo "$CI_REPOSITORY" \
            --workflow ci.yml \
            --branch main \
            --current-run-id "$CI_CURRENT_RUN_ID" \
            --current-conclusion "$CI_CURRENT_CONCLUSION" \
            --current-report current-metrics/ci-performance-report.json \
            --history-limit 20 \
            --minimum-baseline-samples 5 \
            --minimum-failure-samples 10 \
            --build-regression-percent 15 \
            --scan-regression-percent 20 \
            --failure-rate-percent 10 \
            --output-json ci-performance-regression.json \
            --output-markdown ci-performance-regression.md

      - name: Upload performance regression decision
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-performance-regression
          path: |
            ci-performance-regression.json
            ci-performance-regression.md
          if-no-files-found: ignore
          retention-days: 30
