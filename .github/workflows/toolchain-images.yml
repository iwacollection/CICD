name: Toolchain Supply Chain

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "ci/toolchains.json"
      - "ci/supply-chain-policy.json"
      - "docker/toolchains/**"
      - "scripts/ci/toolchain_catalog.py"
      - "scripts/ci/supply_chain_policy.py"
      - "scripts/ci/run_build.py"
      - "scripts/ci/collect_build_metadata.py"
      - "scripts/ci/resolve_toolchain.py"
      - "scripts/ci/package_artifact.py"
      - "scripts/ci/verify_artifact.py"
      - "examples/java17-maven-service/**"
      - ".github/workflows/toolchain-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain-supply-chain-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    name: Discover managed toolchains
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      consumer_matrix: ${{ steps.consumers.outputs.consumer_matrix }}
      consumer_count: ${{ steps.consumers.outputs.consumer_count }}
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate toolchain catalog
        run: python3 scripts/ci/toolchain_catalog.py

      - name: Validate immutable supply-chain policy
        run: python3 scripts/ci/supply_chain_policy.py

      - name: Detect toolchain-supply-chain change
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          relevant=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            relevant=false
            while IFS= read -r path; do
              case "$path" in
                ci/toolchains.json|ci/supply-chain-policy.json|docker/toolchains/*|scripts/ci/toolchain_catalog.py|scripts/ci/supply_chain_policy.py|scripts/ci/run_build.py|scripts/ci/collect_build_metadata.py|scripts/ci/resolve_toolchain.py|scripts/ci/package_artifact.py|scripts/ci/verify_artifact.py|examples/java17-maven-service/*|examples/java17-maven-service/**|.github/workflows/toolchain-images.yml)
                  relevant=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" --)
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Toolchain verification relevant: $relevant"

      - name: Discover buildable toolchains
        id: matrix
        shell: bash
        env:
          RELEVANT: ${{ steps.scope.outputs.relevant }}
        run: |
          set -euo pipefail
          if [[ "$RELEVANT" == "true" ]]; then
            python3 scripts/ci/toolchain_catalog.py --matrix
          else
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            echo '{"include":[]}'
          fi

      - name: Discover pinned candidate consumers
        id: consumers
        shell: bash
        env:
          RELEVANT: ${{ steps.scope.outputs.relevant }}
        run: |
          set -euo pipefail
          if [[ "$RELEVANT" == "true" ]]; then
            python3 scripts/ci/toolchain_catalog.py --consumer-matrix
            echo "Raw consumer outputs:"
            cat "$GITHUB_OUTPUT"
          else
            echo 'consumer_matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'consumer_count=0' >> "$GITHUB_OUTPUT"
            echo '{"include":[]}'
          fi

  verify:
    name: Verify / ${{ matrix.toolchain }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build candidate locally
        shell: bash
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
          PLATFORM: ${{ matrix.platform }}
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -euo pipefail
          docker buildx build \
            --pull \
            --load \
            --platform "$PLATFORM" \
            --cache-from "type=gha,scope=toolchain-$TOOLCHAIN" \
            --cache-to "type=gha,mode=max,scope=toolchain-$TOOLCHAIN" \
            -f "$DOCKERFILE" \
            -t "ci-toolchain-verify:$GITHUB_SHA" \
            "$CONTEXT"

      - name: Smoke test candidate
        shell: bash
        env:
          SMOKE_COMMAND: ${{ matrix.smoke_command }}
        run: |
          set -euo pipefail
          docker run --rm "ci-toolchain-verify:$GITHUB_SHA" bash -euo pipefail -c "$SMOKE_COMMAND"

      - name: Scan candidate vulnerabilities and licenses
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Trivy v0.70.0
        with:
          scan-type: image
          image-ref: ci-toolchain-verify:${{ github.sha }}
          scanners: vuln,license
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: toolchain-security.json
          exit-code: "0"
          version: v0.70.0

      - name: Enforce candidate supply-chain policy
        run: >-
          python3 scripts/ci/supply_chain_policy.py
          --skip-dockerfiles
          --report toolchain-security.json

      - name: Generate candidate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Trivy v0.70.0
        with:
          scan-type: image
          image-ref: ci-toolchain-verify:${{ github.sha }}
          format: cyclonedx
          output: toolchain-sbom.cdx.json
          version: v0.70.0

      - name: Verify source identity
        shell: bash
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          echo "Dockerfile SHA256: $(sha256sum "$DOCKERFILE" | awk '{print $1}')"
          docker image inspect "ci-toolchain-verify:$GITHUB_SHA" --format 'Local image ID: {{.Id}}'

  gate:
    name: Toolchain gate
    needs: [discover, verify]
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce aggregate verification result
        shell: bash
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          MATRIX_COUNT: ${{ needs.discover.outputs.count }}
          RELEVANT: ${{ needs.discover.outputs.relevant }}
          CONSUMER_COUNT: ${{ needs.discover.outputs.consumer_count }}
          CONSUMER_MATRIX: ${{ needs.discover.outputs.consumer_matrix }}
        run: |
          set -euo pipefail
          if [[ "$DISCOVER_RESULT" != "success" ]]; then
            echo "Toolchain discovery failed: $DISCOVER_RESULT" >&2
            exit 1
          fi
          if [[ "$MATRIX_COUNT" == "0" ]]; then
            if [[ "$VERIFY_RESULT" != "skipped" && "$VERIFY_RESULT" != "success" ]]; then
              echo "Zero-toolchain verification should be skipped/success, got: $VERIFY_RESULT" >&2
              exit 1
            fi
          elif [[ "$VERIFY_RESULT" != "success" ]]; then
            echo "One or more toolchain verification jobs failed: $VERIFY_RESULT" >&2
            exit 1
          fi
          echo "Toolchain gate passed: relevant=$RELEVANT matrix_count=$MATRIX_COUNT verify_result=$VERIFY_RESULT"
          echo "Candidate consumer count: $CONSUMER_COUNT"
          echo "Candidate consumer matrix: $CONSUMER_MATRIX"

  candidate-consumer:
    name: Candidate consumer / ${{ matrix.toolchain }}
    needs: [discover, gate]
    if: always() && needs.discover.outputs.consumer_count != '0' && needs.gate.result == 'success'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.consumer_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Login GHCR read-only
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 / Cosign v3.0.6

      - name: Verify Candidate image signature
        shell: bash
        env:
          IMAGE: ${{ matrix.immutable_reference }}
        run: |
          set -euo pipefail
          cosign verify "$IMAGE" \
            --certificate-identity="https://github.com/${{ github.repository }}/.github/workflows/toolchain-images.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

      - name: Pull exact Candidate digest
        shell: bash
        env:
          IMAGE: ${{ matrix.immutable_reference }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          expected="$(printf '%s' "$IMAGE" | awk -F@ '{print $2}')"
          repo_digests="$(docker image inspect "$IMAGE" --format '{{json .RepoDigests}}')"
          [[ "$repo_digests" == *"@$expected"* ]] || {
            echo "Pulled image does not match central Candidate digest: $IMAGE" >&2
            exit 1
          }

      - name: Build, test and run Java 17 consumer
        shell: bash
        env:
          IMAGE: ${{ matrix.immutable_reference }}
          FIXTURE: ${{ matrix.consumer_fixture }}
          EXPECTED_JDK_VERSION: ${{ matrix.jdk_version }}
          EXPECTED_MAVEN_VERSION: ${{ matrix.maven_version }}
        run: |
          set -euo pipefail
          expected_java_version="$(printf '%s' "$EXPECTED_JDK_VERSION" | cut -d+ -f1)"
          build_command="$(cat <<'BUILD_COMMAND'
          set -euo pipefail
          actual_java_version="$(java -version 2>&1 | sed -n '1s/.*version "\([^"]*\)".*/\1/p')"
          actual_java_spec="$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/^[[:space:]]*java.specification.version =/ { print $2; exit }')"
          actual_maven_version="$(mvn --version 2>&1 | sed -n '1s/^Apache Maven \([^ ]*\).*/\1/p')"
          test "$actual_java_version" = "$EXPECTED_JAVA_VERSION"
          test "$actual_java_spec" = "17"
          test "$actual_maven_version" = "$EXPECTED_MAVEN_VERSION"
          mvn --batch-mode --no-transfer-progress clean verify
          java -jar target/java17-maven-service-1.0.0.jar | grep -Fx java17-maven-consumer-ok
          BUILD_COMMAND
          )"
          EXPECTED_JAVA_VERSION="$expected_java_version" \
          EXPECTED_MAVEN_VERSION="$EXPECTED_MAVEN_VERSION" \
          python3 scripts/ci/run_build.py \
            --working-directory "$FIXTURE" \
            --container-image "$IMAGE" \
            --command "$build_command"

      - name: Collect actual JDK and Maven metadata
        shell: bash
        env:
          IMAGE: ${{ matrix.immutable_reference }}
          FIXTURE: ${{ matrix.consumer_fixture }}
        run: |
          set -euo pipefail
          python3 scripts/ci/collect_build_metadata.py \
            --working-directory "$FIXTURE" \
            --container-image "$IMAGE" \
            --output build-environment.json

      - name: Package Artifact Contract v2
        id: package
        shell: bash
        env:
          FIXTURE: ${{ matrix.consumer_fixture }}
          TOOLCHAIN: ${{ matrix.toolchain }}
          IMAGE: ${{ matrix.immutable_reference }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git -C "$FIXTURE" show -s --format=%ct HEAD)"
          python3 scripts/ci/package_artifact.py \
            --project java17-maven-service \
            --working-directory "$FIXTURE" \
            --artifacts-json '["target/java17-maven-service-1.0.0.jar"]' \
            --dependency-locks-json '["pom.xml"]' \
            --soc generic \
            --target-os linux \
            --arch x86_64 \
            --toolchain "$TOOLCHAIN" \
            --execution-mode container \
            --container-image "$IMAGE" \
            --runner-labels-json '["ubuntu-latest"]' \
            --build-metadata-file build-environment.json

      - name: Verify Artifact Contract v2
        shell: bash
        env:
          DIGEST: ${{ steps.package.outputs.digest }}
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_artifact.py \
            --directory dist \
            --expected-sha256 "$DIGEST" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-repository "$GITHUB_REPOSITORY"

      - name: Upload Java consumer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-consumer-${{ matrix.toolchain }}-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.manifest.json
            dist/*.sha256
            build-environment.json
            ${{ matrix.consumer_fixture }}/target/surefire-reports/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Consumer summary
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
          IMAGE: ${{ matrix.immutable_reference }}
          JDK: ${{ matrix.jdk_version }}
          MAVEN: ${{ matrix.maven_version }}
          ARTIFACT_DIGEST: ${{ steps.package.outputs.digest }}
        run: |
          {
            echo "### Java Candidate consumer passed"
            echo "- Toolchain: $TOOLCHAIN"
            echo "- Candidate image: $IMAGE"
            echo "- JDK: $JDK"
            echo "- Maven: $MAVEN"
            echo "- Artifact Contract v2 bundle SHA256: $ARTIFACT_DIGEST"
            echo "- Status remains Candidate; this fixture is not a production project promotion."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish / ${{ matrix.toolchain }}
    needs: [discover, gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.discover.outputs.count != '0'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable candidate
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          pull: true
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=toolchain-${{ matrix.toolchain }}
          cache-to: type=gha,mode=max,scope=toolchain-${{ matrix.toolchain }}
          provenance: mode=max
          sbom: true

      - name: Smoke test exact published digest
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SMOKE_COMMAND: ${{ matrix.smoke_command }}
        run: |
          set -euo pipefail
          immutable_image="${IMAGE}@${DIGEST}"
          docker pull "$immutable_image"
          docker run --rm "$immutable_image" bash -euo pipefail -c "$SMOKE_COMMAND"

      - name: Scan exact published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Trivy v0.70.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}@${{ steps.push.outputs.digest }}
          scanners: vuln,license
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: published-security.json
          exit-code: "0"
          version: v0.70.0

      - name: Enforce published image policy
        run: >-
          python3 scripts/ci/supply_chain_policy.py
          --skip-dockerfiles
          --report published-security.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 / Cosign v3.0.6

      - name: Cosign exact published digest
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          immutable_image="${IMAGE}@${DIGEST}"
          cosign sign --yes "$immutable_image"
          cosign verify "$immutable_image" \
            --certificate-identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/toolchain-images.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

      - name: Attest published image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate promotion record
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          dockerfile_sha="$(sha256sum "$DOCKERFILE" | awk '{print $1}')"
          export DOCKERFILE_SHA="$dockerfile_sha"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          record = {
              "schema_version": 2,
              "toolchain": os.environ["TOOLCHAIN"],
              "image": os.environ["IMAGE"],
              "digest": os.environ["DIGEST"],
              "immutable_reference": f"{os.environ['IMAGE']}@{os.environ['DIGEST']}",
              "source_commit": os.environ["GITHUB_SHA"],
              "dockerfile": os.environ["DOCKERFILE"],
              "dockerfile_sha256": os.environ["DOCKERFILE_SHA"],
              "platform": os.environ["PLATFORM"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "supply_chain_policy": "ci/supply-chain-policy.json",
              "cosign_verified": True,
              "buildkit_sbom": True,
              "github_provenance": True,
          }
          Path(f"promotion-{os.environ['TOOLCHAIN']}.json").write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf-8"
          )
          PY
          cat "promotion-$TOOLCHAIN.json"

      - name: Upload promotion record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toolchain-promotion-${{ matrix.toolchain }}-${{ github.sha }}
          path: promotion-${{ matrix.toolchain }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Promotion summary
        run: |
          {
            echo "### Toolchain candidate published"
            echo "- Toolchain: ${{ matrix.toolchain }}"
            echo "- Immutable reference: ${{ matrix.image }}@${{ steps.push.outputs.digest }}"
            echo "- Vulnerability/license policy: PASSED"
            echo "- SBOM: BuildKit OCI attestation generated"
            echo "- Cosign: keyless signature verified"
            echo "- Provenance: GitHub build provenance attestation generated"
            echo "- Promotion: register this digest in ci/toolchains.json before business consumption"
          } >> "$GITHUB_STEP_SUMMARY"
