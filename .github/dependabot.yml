version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: docker
    directory: /docker/toolchains/gcc-host
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(toolchain)"
